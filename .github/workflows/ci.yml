name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── 1. Lint (ESLint — только web) ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint (web)
        run: pnpm --filter @tv-shifts/web exec eslint .

  # ── 2. TypeScript ──────────────────────────────────────────────────────────
  tsc:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: tsc (web)
        run: pnpm --filter @tv-shifts/web exec tsc --noEmit

      - name: tsc (api)
        run: pnpm --filter @tv-shifts/api build

  # ── 3. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tvshifts
          POSTGRES_PASSWORD: tvshifts_pass
          POSTGRES_DB: tvshifts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvshifts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tvshifts:tvshifts_pass@localhost:5432/tvshifts_test
      TEST_DATABASE_URL: postgresql://tvshifts:tvshifts_pass@localhost:5432/tvshifts_test
      JWT_SECRET: ci-test-secret-not-used-in-prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:migrate:test

      - name: Run tests
        run: pnpm test

  # ── 4. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, tsc, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build (api + web)
        env:
          VITE_API_URL: http://localhost:4000
        run: pnpm build
