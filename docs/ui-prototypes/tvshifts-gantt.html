<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Shifts — Gantt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0A0A0C;
    --surf1: #131318;
    --surf2: #1C1C24;
    --surf3: #242430;
    --border: rgba(255,255,255,0.07);
    --text: #FFFFFF;
    --text2: #8A8A9A;
    --text3: #464658;
    --accent1: #FF6B35;
    --accent2: #E8194B;
    --day-w: 40px;
    --row-h: 48px;
    --header-h: 60px;
    --timeline-header-h: 36px;
    --left-w: 240px;
  }

  body {
    font-family: 'Urbanist', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── HEADER ── */
  .app-header {
    height: var(--header-h);
    background: var(--surf1);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.3px;
  }

  .logo-sep {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  .page-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .header-spacer { flex: 1; }

  .nav-btn {
    width: 32px;
    height: 32px;
    background: var(--surf2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: var(--surf3); color: var(--text); }

  .nav-range {
    font-size: 12px;
    color: var(--text2);
    min-width: 140px;
    text-align: center;
    font-weight: 500;
  }

  .add-btn {
    height: 32px;
    padding: 0 14px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Urbanist', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s;
    margin-left: 8px;
  }
  .add-btn:hover { opacity: 0.88; }

  /* ── BODY ── */
  .gantt-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── LEFT PANEL ── */
  .left-panel {
    width: var(--left-w);
    flex-shrink: 0;
    background: var(--surf1);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .left-panel-header {
    height: var(--timeline-header-h);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
  }

  .left-panel-header span {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text3);
  }

  .task-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--surf3) transparent;
  }

  .task-row {
    height: var(--row-h);
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    transition: background 0.1s;
  }
  .task-row:hover { background: rgba(255,255,255,0.025); }

  .task-checkbox {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--text3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.15s, background 0.15s;
    font-size: 10px;
    color: transparent;
  }
  .task-checkbox.checked {
    border-color: var(--accent1);
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
  }

  .task-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    transition: color 0.15s;
  }
  .task-label.done {
    text-decoration: line-through;
    color: var(--text3);
  }

  /* ── RIGHT / TIMELINE ── */
  .timeline-wrapper {
    flex: 1;
    overflow-x: auto;
    overflow-y: auto;
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: var(--surf3) transparent;
  }

  .timeline-inner {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Sticky header row */
  .timeline-header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: var(--timeline-header-h);
    background: var(--surf1);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-shrink: 0;
  }

  .day-cell {
    width: var(--day-w);
    flex-shrink: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1px;
    border-right: 1px solid var(--border);
  }
  .day-cell.weekend { background: rgba(255,255,255,0.02); }
  .day-cell.today-header {
    background: rgba(232,25,75,0.08);
  }

  .day-num {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    line-height: 1;
  }
  .day-wk {
    font-size: 9px;
    font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .day-cell.today-header .day-num { color: var(--accent2); }
  .day-cell.today-header .day-wk { color: var(--accent2); opacity: 0.7; }

  /* Grid rows */
  .timeline-rows {
    position: relative;
    flex: 1;
  }

  .grid-row {
    height: var(--row-h);
    border-bottom: 1px solid var(--border);
    position: relative;
    display: flex;
  }

  .grid-cell {
    width: var(--day-w);
    flex-shrink: 0;
    height: 100%;
    border-right: 1px solid var(--border);
  }
  .grid-cell.weekend { background: rgba(255,255,255,0.015); }
  .grid-cell.today-col { background: rgba(232,25,75,0.04); }

  /* Today line */
  .today-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--accent2) 0%, rgba(232,25,75,0.2) 100%);
    pointer-events: none;
    z-index: 30;
    border-radius: 1px;
  }
  .today-line::before {
    content: '';
    position: absolute;
    top: -3px;
    left: -4px;
    width: 10px;
    height: 10px;
    background: var(--accent2);
    border-radius: 50%;
  }

  /* Bars */
  .bar-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .gantt-bar {
    position: absolute;
    height: 28px;
    top: 10px;
    border-radius: 6px;
    cursor: grab;
    pointer-events: all;
    display: flex;
    align-items: center;
    overflow: visible;
    transition: filter 0.12s, opacity 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  .gantt-bar:hover { filter: brightness(1.15); }
  .gantt-bar.dragging { filter: brightness(1.25); cursor: grabbing; z-index: 200; }
  .gantt-bar.done-bar { opacity: 0.35; filter: grayscale(1); }

  .bar-inner {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 8px;
  }

  .bar-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  .bar-done-icon {
    position: absolute;
    right: 7px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    display: none;
  }
  .done-bar .bar-done-icon { display: block; }
  .done-bar .bar-label { opacity: 0.5; }

  /* Resize handles */
  .bar-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 8px;
    cursor: ew-resize;
    z-index: 10;
    pointer-events: all;
  }
  .bar-handle.left { left: 0; border-radius: 6px 0 0 6px; }
  .bar-handle.right { right: 0; border-radius: 0 6px 6px 0; }

  /* Bar date tooltip */
  .bar-dates {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 6px);
    transform: translateX(-50%);
    background: var(--surf3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
    pointer-events: none;
    z-index: 999;
    display: none;
  }
  .gantt-bar.dragging .bar-dates { display: block; }

  /* Tooltip on hover */
  .tooltip {
    position: fixed;
    background: var(--surf3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text2);
    pointer-events: none;
    z-index: 9999;
    display: none;
    max-width: 200px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .tooltip.visible { display: block; }
  .tooltip-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .tooltip-row { margin-top: 2px; }

  /* Creation ghost */
  .create-ghost {
    position: absolute;
    height: 28px;
    top: 10px;
    border-radius: 6px;
    background: rgba(255,107,53,0.4);
    border: 2px dashed var(--accent1);
    pointer-events: none;
    z-index: 150;
    display: none;
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">TV Shifts</div>
  <div class="logo-sep"></div>
  <div class="page-title">Gantt</div>
  <div class="header-spacer"></div>
  <button class="nav-btn" id="prevBtn" title="Назад на 7 дней">&#8592;</button>
  <div class="nav-range" id="navRange"></div>
  <button class="nav-btn" id="nextBtn" title="Вперёд на 7 дней">&#8594;</button>
  <button class="add-btn" id="addTaskBtn">+ Задача</button>
</div>

<div class="gantt-body">
  <div class="left-panel">
    <div class="left-panel-header"><span>Задачи</span></div>
    <div class="task-list" id="taskList"></div>
  </div>

  <div class="timeline-wrapper" id="timelineWrapper">
    <div class="timeline-inner" id="timelineInner">
      <div class="timeline-header" id="timelineHeader"></div>
      <div class="timeline-rows" id="timelineRows">
        <div class="today-line" id="todayLine"></div>
        <div class="bar-layer" id="barLayer"></div>
        <div class="create-ghost" id="createGhost"></div>
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-title" id="ttTitle"></div>
  <div class="tooltip-row" id="ttStart"></div>
  <div class="tooltip-row" id="ttEnd"></div>
  <div class="tooltip-row" id="ttDur"></div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────
const TASKS = [
  { id:1, title:'Разработка концепции', start:'2026-05-01', end:'2026-05-05', color:'#8B5CF6', done:false },
  { id:2, title:'Написание сценария',   start:'2026-05-04', end:'2026-05-10', color:'#0EA5E9', done:false },
  { id:3, title:'Съёмочный период',     start:'2026-05-08', end:'2026-05-18', color:'#FF6B35', done:false },
  { id:4, title:'Монтаж',               start:'2026-05-15', end:'2026-05-22', color:'#E8194B', done:false },
  { id:5, title:'Озвучка и музыка',     start:'2026-05-20', end:'2026-05-25', color:'#F59E0B', done:false },
  { id:6, title:'Согласование',         start:'2026-05-23', end:'2026-05-27', color:'#29BF12', done:false },
  { id:7, title:'Финальный монтаж',     start:'2026-05-26', end:'2026-05-30', color:'#8B5CF6', done:false },
];

const DAY_W = 40;
const ROW_H = 48;
const TOTAL_DAYS = 30;
const WEEKEND = [0, 6]; // Sun, Sat
const WEEKDAYS_RU = ['вс','пн','вт','ср','чт','пт','сб'];
const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

// ── STATE ────────────────────────────────────────────────────────────────
let tasks = TASKS.map(t => ({ ...t }));
let viewStart = new Date('2026-05-01'); // first day shown
let nextId = 8;

// ── HELPERS ─────────────────────────────────────────────────────────────
function parseDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDisplay(d) {
  return `${d.getDate()} ${MONTHS_RU[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}
function dayIndex(date) {
  return daysBetween(viewStart, date);
}
function pxToDay(px) {
  return Math.floor(px / DAY_W);
}
function snapToDay(px) {
  return Math.round(px / DAY_W) * DAY_W;
}

// Task duration in days (inclusive)
function taskDuration(t) {
  return daysBetween(parseDate(t.start), parseDate(t.end)) + 1;
}

// ── DOM REFS ─────────────────────────────────────────────────────────────
const taskList       = document.getElementById('taskList');
const timelineHeader = document.getElementById('timelineHeader');
const timelineRows   = document.getElementById('timelineRows');
const barLayer       = document.getElementById('barLayer');
const todayLine      = document.getElementById('todayLine');
const createGhost    = document.getElementById('createGhost');
const tooltip        = document.getElementById('tooltip');
const navRange       = document.getElementById('navRange');
const ttTitle        = document.getElementById('ttTitle');
const ttStart        = document.getElementById('ttStart');
const ttEnd          = document.getElementById('ttEnd');
const ttDur          = document.getElementById('ttDur');
const timelineWrapper = document.getElementById('timelineWrapper');

// Sync scroll between left panel and timeline rows
taskList.addEventListener('scroll', () => {
  timelineWrapper.scrollTop = taskList.scrollTop;
});
timelineWrapper.addEventListener('scroll', () => {
  taskList.scrollTop = timelineWrapper.scrollTop;
});

// ── RENDER ───────────────────────────────────────────────────────────────
function render() {
  renderHeader();
  renderLeftPanel();
  renderGrid();
  renderBars();
  renderTodayLine();
  renderNavRange();
}

function renderNavRange() {
  const end = addDays(viewStart, TOTAL_DAYS - 1);
  navRange.textContent = `${formatDisplay(viewStart)} — ${formatDisplay(end)}`;
}

function renderHeader() {
  timelineHeader.innerHTML = '';
  timelineHeader.style.width = (TOTAL_DAYS * DAY_W) + 'px';
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = addDays(viewStart, i);
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const dow = d.getDay();
    if (WEEKEND.includes(dow)) cell.classList.add('weekend');
    const todayStr = formatDate(new Date());
    if (formatDate(d) === todayStr) cell.classList.add('today-header');

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = d.getDate();

    const wkEl = document.createElement('div');
    wkEl.className = 'day-wk';
    wkEl.textContent = WEEKDAYS_RU[dow];

    cell.appendChild(numEl);
    cell.appendChild(wkEl);
    timelineHeader.appendChild(cell);
  }
}

function renderLeftPanel() {
  taskList.innerHTML = '';
  tasks.forEach((task, idx) => {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.idx = idx;

    const cb = document.createElement('div');
    cb.className = 'task-checkbox' + (task.done ? ' checked' : '');
    cb.innerHTML = task.done ? '✓' : '';
    cb.title = task.done ? 'Отметить невыполненным' : 'Отметить выполненным';
    cb.addEventListener('click', () => {
      tasks[idx].done = !tasks[idx].done;
      render();
    });

    const label = document.createElement('div');
    label.className = 'task-label' + (task.done ? ' done' : '');
    label.textContent = task.title;
    label.title = task.title;

    row.appendChild(cb);
    row.appendChild(label);
    taskList.appendChild(row);
  });
}

function renderGrid() {
  // Remove old grid rows (keep bar layer, today line, ghost)
  const existingRows = timelineRows.querySelectorAll('.grid-row');
  existingRows.forEach(r => r.remove());

  const totalW = TOTAL_DAYS * DAY_W;
  const todayStr = formatDate(new Date());

  tasks.forEach((task, taskIdx) => {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.style.width = totalW + 'px';
    row.dataset.taskIdx = taskIdx;

    for (let i = 0; i < TOTAL_DAYS; i++) {
      const d = addDays(viewStart, i);
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      const dow = d.getDay();
      if (WEEKEND.includes(dow)) cell.classList.add('weekend');
      if (formatDate(d) === todayStr) cell.classList.add('today-col');
      row.appendChild(cell);
    }

    // Insert grid rows before bar layer
    timelineRows.insertBefore(row, barLayer);

    // Creation drag on empty row area
    attachCreateDrag(row, taskIdx);
  });

  // Update rows container height
  timelineRows.style.height = (tasks.length * ROW_H) + 'px';
  barLayer.style.width = totalW + 'px';
  barLayer.style.height = (tasks.length * ROW_H) + 'px';
}

function renderBars() {
  barLayer.innerHTML = '';
  barLayer.style.position = 'absolute';
  barLayer.style.inset = '0';
  barLayer.style.pointerEvents = 'none';

  tasks.forEach((task, taskIdx) => {
    const startIdx = dayIndex(parseDate(task.start));
    const endIdx   = dayIndex(parseDate(task.end));
    if (endIdx < 0 || startIdx >= TOTAL_DAYS) return; // out of view

    const clampedStart = Math.max(0, startIdx);
    const clampedEnd   = Math.min(TOTAL_DAYS - 1, endIdx);
    const left  = clampedStart * DAY_W;
    const width = (clampedEnd - clampedStart + 1) * DAY_W;

    const bar = document.createElement('div');
    bar.className = 'gantt-bar' + (task.done ? ' done-bar' : '');
    bar.style.left   = left + 'px';
    bar.style.top    = (taskIdx * ROW_H) + 'px';
    bar.style.width  = width + 'px';
    bar.style.pointerEvents = 'all';

    const inner = document.createElement('div');
    inner.className = 'bar-inner';
    inner.style.background = task.done
      ? 'rgba(100,100,120,0.6)'
      : `linear-gradient(135deg, ${task.color}ee, ${task.color}99)`;

    const lbl = document.createElement('div');
    lbl.className = 'bar-label';
    lbl.textContent = task.title;

    const doneIcon = document.createElement('div');
    doneIcon.className = 'bar-done-icon';
    doneIcon.textContent = '✓';

    inner.appendChild(lbl);
    inner.appendChild(doneIcon);
    bar.appendChild(inner);

    // Date display during drag
    const dates = document.createElement('div');
    dates.className = 'bar-dates';
    dates.id = `bar-dates-${taskIdx}`;
    bar.appendChild(dates);

    // Resize handles
    const lh = document.createElement('div');
    lh.className = 'bar-handle left';
    const rh = document.createElement('div');
    rh.className = 'bar-handle right';
    bar.appendChild(lh);
    bar.appendChild(rh);

    barLayer.appendChild(bar);

    attachBarDrag(bar, task, taskIdx, lh, rh, dates);
    attachBarTooltip(bar, task);
  });
}

function renderTodayLine() {
  const todayStr = formatDate(new Date());
  const todayD   = parseDate(todayStr);
  const idx      = dayIndex(todayD);
  if (idx < 0 || idx >= TOTAL_DAYS) {
    todayLine.style.display = 'none';
    return;
  }
  todayLine.style.display = 'block';
  // Center on today column
  todayLine.style.left = (idx * DAY_W + DAY_W / 2 - 1) + 'px';
}

// ── BAR DRAG ─────────────────────────────────────────────────────────────
function attachBarDrag(bar, task, taskIdx, lhEl, rhEl, datesEl) {
  function updateDatesLabel() {
    const dur = taskDuration(task);
    datesEl.textContent = `${task.start} → ${task.end} (${dur} д.)`;
  }

  function startDrag(e, mode) {
    e.preventDefault();
    e.stopPropagation();
    bar.classList.add('dragging');
    updateDatesLabel();

    const startX    = e.clientX;
    const origStart = parseDate(task.start);
    const origEnd   = parseDate(task.end);
    const origDur   = daysBetween(origStart, origEnd); // duration in full days

    function onMove(mv) {
      const dx   = mv.clientX - startX;
      const dDay = Math.round(dx / DAY_W);

      if (mode === 'move') {
        const newStart = addDays(origStart, dDay);
        const newEnd   = addDays(origEnd,   dDay);
        task.start = formatDate(newStart);
        task.end   = formatDate(newEnd);
      } else if (mode === 'resize-left') {
        const newStart = addDays(origStart, dDay);
        // Ensure at least 1 day
        if (daysBetween(newStart, origEnd) >= 0) {
          task.start = formatDate(newStart);
        }
      } else if (mode === 'resize-right') {
        const newEnd = addDays(origEnd, dDay);
        if (daysBetween(origStart, newEnd) >= 0) {
          task.end = formatDate(newEnd);
        }
      }

      // Reposition bar live
      repositionBar(bar, task, taskIdx, datesEl);
    }

    function onUp() {
      bar.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      render();
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  lhEl.addEventListener('mousedown', e => startDrag(e, 'resize-left'));
  rhEl.addEventListener('mousedown', e => startDrag(e, 'resize-right'));

  bar.addEventListener('mousedown', e => {
    // Only middle area triggers move
    const rect = bar.getBoundingClientRect();
    const localX = e.clientX - rect.left;
    if (localX < 8 || localX > rect.width - 8) return;
    startDrag(e, 'move');
  });
}

function repositionBar(bar, task, taskIdx, datesEl) {
  const startIdx   = dayIndex(parseDate(task.start));
  const endIdx     = dayIndex(parseDate(task.end));
  const clampedStart = Math.max(0, startIdx);
  const clampedEnd   = Math.min(TOTAL_DAYS - 1, endIdx);
  const left  = clampedStart * DAY_W;
  const width = Math.max(DAY_W, (clampedEnd - clampedStart + 1) * DAY_W);
  bar.style.left  = left + 'px';
  bar.style.width = width + 'px';
  const dur = taskDuration(task);
  datesEl.textContent = `${task.start} → ${task.end} (${dur} д.)`;
}

// ── TOOLTIP ──────────────────────────────────────────────────────────────
function attachBarTooltip(bar, task) {
  bar.addEventListener('mouseenter', e => {
    if (bar.classList.contains('dragging')) return;
    const dur = taskDuration(task);
    ttTitle.textContent = task.title;
    ttStart.textContent = `Начало: ${formatDisplay(parseDate(task.start))}`;
    ttEnd.textContent   = `Конец:  ${formatDisplay(parseDate(task.end))}`;
    ttDur.textContent   = `Длительность: ${dur} д.`;
    tooltip.classList.add('visible');
    moveTooltip(e);
  });
  bar.addEventListener('mousemove', e => {
    if (!bar.classList.contains('dragging')) moveTooltip(e);
  });
  bar.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
  });
}

function moveTooltip(e) {
  const tw = tooltip.offsetWidth || 190;
  const th = tooltip.offsetHeight || 80;
  let x = e.clientX + 14;
  let y = e.clientY - th - 10;
  if (x + tw > window.innerWidth) x = e.clientX - tw - 14;
  if (y < 4) y = e.clientY + 14;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

// ── CREATE DRAG (click-drag on empty row) ─────────────────────────────────
function attachCreateDrag(row, taskIdx) {
  row.addEventListener('mousedown', e => {
    // If click is on a bar, ignore
    if (e.target.closest('.gantt-bar')) return;

    e.preventDefault();
    const rowRect = row.getBoundingClientRect();
    const wrapperRect = timelineWrapper.getBoundingClientRect();
    const scrollLeft = timelineWrapper.scrollLeft;

    const startXRel = e.clientX - wrapperRect.left + scrollLeft;
    const startDay  = pxToDay(startXRel);

    createGhost.style.top    = (taskIdx * ROW_H + 10) + 'px';
    createGhost.style.left   = (startDay * DAY_W) + 'px';
    createGhost.style.width  = DAY_W + 'px';
    createGhost.style.display = 'block';

    let endDay = startDay;

    function onMove(mv) {
      const curXRel = mv.clientX - wrapperRect.left + scrollLeft;
      endDay = pxToDay(curXRel);
      if (endDay < startDay) endDay = startDay;
      const ghostLeft = startDay * DAY_W;
      const ghostW    = (endDay - startDay + 1) * DAY_W;
      createGhost.style.left  = ghostLeft + 'px';
      createGhost.style.width = ghostW + 'px';
    }

    function onUp() {
      createGhost.style.display = 'none';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);

      if (endDay < startDay) endDay = startDay;
      const newStart = addDays(viewStart, startDay);
      const newEnd   = addDays(viewStart, endDay);

      // Get task name
      const name = prompt('Название новой задачи:', 'Новая задача');
      if (!name || !name.trim()) return;

      // Insert after taskIdx
      const newTask = {
        id: nextId++,
        title: name.trim(),
        start: formatDate(newStart),
        end:   formatDate(newEnd),
        color: '#8B5CF6',
        done:  false,
      };
      tasks.splice(taskIdx + 1, 0, newTask);
      render();
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ── NAV ──────────────────────────────────────────────────────────────────
document.getElementById('prevBtn').addEventListener('click', () => {
  viewStart = addDays(viewStart, -7);
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewStart = addDays(viewStart, 7);
  render();
});

// ── ADD TASK ─────────────────────────────────────────────────────────────
document.getElementById('addTaskBtn').addEventListener('click', () => {
  const name = prompt('Название задачи:', 'Новая задача');
  if (!name || !name.trim()) return;
  const today     = formatDate(new Date());
  const dayAfter  = formatDate(addDays(new Date(), 3));
  const colors    = ['#8B5CF6','#0EA5E9','#FF6B35','#E8194B','#F59E0B','#29BF12'];
  const color     = colors[nextId % colors.length];
  tasks.push({
    id: nextId++,
    title: name.trim(),
    start: today,
    end:   dayAfter,
    color,
    done: false,
  });
  render();
});

// ── CURSOR CHANGE FOR BAR EDGES ──────────────────────────────────────────
document.addEventListener('mousemove', e => {
  const bar = e.target.closest('.gantt-bar');
  if (!bar) return;
  const rect   = bar.getBoundingClientRect();
  const localX = e.clientX - rect.left;
  if (localX < 8 || localX > rect.width - 8) {
    bar.style.cursor = 'ew-resize';
  } else {
    bar.style.cursor = bar.classList.contains('dragging') ? 'grabbing' : 'grab';
  }
});

// ── INIT ─────────────────────────────────────────────────────────────────
render();
</script>
