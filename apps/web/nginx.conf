server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and WebSocket to nexus-api container.
    # ВАЖНО: список префиксов ДОЛЖЕН совпадать с register(...) в apps/api/src/server.ts.
    # Любой новый роут rebuild-v4 надо добавлять сюда, иначе путь уходит в SPA-fallback
    # и фронт получает index.html вместо JSON (→ краши вида "X.find is not a function").
    location ~ ^/(auth|users|tasks|projects|work-items|tracks|clients|events|calendar-entries|chats|database|structure|health|day-entries|svod|board|analytics|access|notifications|refs|posts)(/.*)?$ {
        proxy_pass         http://nexus-api:4000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support (for /chats/ws)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
