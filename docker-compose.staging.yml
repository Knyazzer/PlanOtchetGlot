version: '3.9'

# Staging environment — запускается перед деплоем в prod для проверки миграций и новых версий.
# Использует те же образы, что и prod, но изолированную БД и HTTP (без SSL).
#
# Требует файл .env.staging (скопируй .env.example, заполни STAGING_* переменные).
# Запуск: docker compose -f docker-compose.staging.yml --env-file .env.staging up -d

services:
  postgres_staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_staging:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      postgres_staging:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_staging:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WEB_URL: ${WEB_URL}
      NODE_ENV: staging
      PORT: 4000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_PROJECTS_SHEET_ID: ${GOOGLE_PROJECTS_SHEET_ID:-}
      GOOGLE_REGISTRY_SHEET_ID: ${GOOGLE_REGISTRY_SHEET_ID:-}
    expose:
      - "4000"

  web_staging:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    expose:
      - "80"

  nginx_staging:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api_staging
      - web_staging
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_staging_data:
