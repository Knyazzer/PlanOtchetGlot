events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # HTTP → HTTPS redirect + Let's Encrypt challenge
  server {
    listen 80;
    server_name tvshift.knzteam.ru;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name tvshift.knzteam.ru;

    ssl_certificate     /etc/letsencrypt/live/tvshift.knzteam.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tvshift.knzteam.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Docker DNS — переспрашивать каждые 10 секунд (иначе nginx кеширует IP навсегда)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Метрики — только для внутреннего скрейпинга, снаружи закрыты
    location = /api/metrics {
      return 403;
    }

    # API
    location /api/ {
      set $api_upstream http://api:4000;
      proxy_pass         $api_upstream/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }

    # Web (SPA)
    location / {
      proxy_pass       http://web:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
