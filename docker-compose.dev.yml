version: '3.9'

# Только база данных для локальной разработки.
# API и Web запускаются напрямую через .\start.ps1

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tvshifts
      POSTGRES_PASSWORD: tvshifts_pass
      POSTGRES_DB: tvshifts
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvshifts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
