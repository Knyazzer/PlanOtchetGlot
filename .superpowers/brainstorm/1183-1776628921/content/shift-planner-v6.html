<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Планировщик смены v6</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.topbar-title { font-size: 14px; font-weight: 600; color: #f1f5f9; }
.date-badge { background: #334155; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: #94a3b8; }
.spacer { flex: 1; }
.zoom-btn { background: #334155; border: none; color: #94a3b8; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.zoom-btn:hover { background: #475569; color: #f1f5f9; }
.zoom-label { font-size: 12px; color: #64748b; min-width: 38px; text-align: center; }
.tab-row { display: flex; background: #0f172a; border-bottom: 1px solid #1e293b; flex-shrink: 0; padding: 0 16px; }
.tab { padding: 8px 16px; font-size: 12px; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: #818cf8; border-bottom-color: #818cf8; }
.planner { flex: 1; display: grid; grid-template-columns: 190px 1fr; grid-template-rows: auto 1fr; overflow: hidden; }
.corner { background: #0d1526; border-right: 1px solid #1e293b; border-bottom: 1px solid #1e293b; display: flex; align-items: flex-end; padding: 0 14px 8px; font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: .05em; }
.header-scroll { overflow: hidden; border-bottom: 1px solid #1e293b; background: #0d1526; }
.names-scroll  { overflow: hidden; border-right: 1px solid #1e293b; background: #0d1526; }
.tracks-scroll { overflow: auto; background: #07101d; }
.tracks-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.tracks-scroll::-webkit-scrollbar-track { background: #0d1526; }
.tracks-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
.name-row { display: flex; align-items: center; padding: 0 10px 0 0; font-size: 12px; color: #cbd5e1; border-bottom: 1px solid #1a2540; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; user-select: none; gap: 0; }
.name-row:hover { background: #1e293b30; }
.name-accent { width: 4px; flex-shrink: 0; align-self: stretch; margin-right: 8px; border-radius: 0; }
.name-section { display: flex; align-items: center; padding: 0 14px; font-size: 10px; color: #475569; border-bottom: 1px solid #1a2540; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; background: #0a1220; height: 26px; flex-shrink: 0; }
#block-popup { position: fixed; z-index: 300; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px 16px; min-width: 200px; box-shadow: 0 8px 32px rgba(0,0,0,.6); display: none; }
#block-popup h4 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.popup-date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.popup-arrow { background: #334155; border: none; color: #cbd5e1; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.popup-arrow:hover { background: #475569; }
#popup-date-label { font-size: 13px; color: #e2e8f0; flex: 1; text-align: center; }
.popup-time { font-size: 12px; color: #64748b; margin-bottom: 12px; }
.popup-close { background: #334155; border: none; color: #94a3b8; border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 12px; width: 100%; }
#drag-tip { position: fixed; background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #e2e8f0; pointer-events: none; display: none; z-index: 1000; }
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-title">«МТС Live Hall» — Корпоратив 2025</span>
  <span class="date-badge">25–28 апреля 2025</span>
  <div class="spacer"></div>
  <div style="display:flex;align-items:center;gap:6px;">
    <button class="zoom-btn" id="zoomOut">−</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="zoom-btn" id="zoomIn">+</button>
  </div>
</div>
<div class="tab-row">
  <div class="tab">Команда</div>
  <div class="tab active">Планировщик смены</div>
  <div class="tab">Производственные расходы</div>
  <div class="tab">Гант</div>
  <div class="tab">Заметки</div>
</div>
<div class="planner" id="planner">
  <div class="corner" id="corner">Специалист</div>
  <div class="header-scroll" id="headerScroll"><div id="headerInner" style="position:relative;"></div></div>
  <div class="names-scroll"  id="namesScroll"><div id="namesInner"></div></div>
  <div class="tracks-scroll" id="tracksScroll"><div id="tracksInner" style="position:relative;"></div></div>
</div>
<div id="block-popup">
  <h4 id="popup-title"></h4>
  <div class="popup-date-row">
    <button class="popup-arrow" id="popupPrev">◄</button>
    <span id="popup-date-label"></span>
    <button class="popup-arrow" id="popupNext">►</button>
  </div>
  <div class="popup-time" id="popup-time"></div>
  <button class="popup-close" id="popupClose">Закрыть</button>
</div>
<div id="drag-tip"></div>
<script>
// ─── TIME HELPERS ─────────────────────────────────────────────────────────
// Anchor: April 26 = day 0. Absolute minutes: day * 1440 + minuteOfDay
// April 25 = -1440..0,  April 27 = 1440..2880,  April 28 = 2880..4320
const ANCHOR = new Date(2025, 3, 26);
const STEP = 30;

function dayOf(m)     { return Math.floor(m / 1440); }
function timeOfDay(m) { const v=((m%1440)+1440)%1440,h=Math.floor(v/60),mm=v%60; return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
function dateLabel(m) { const d=new Date(ANCHOR); d.setDate(d.getDate()+dayOf(m)); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function dateFull(m)  { const d=new Date(ANCHOR); d.setDate(d.getDate()+dayOf(m)); return d.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'}); }
function safeName(n)  { return n.replace(/\s+/g,'_'); }

// ─── DATA ─────────────────────────────────────────────────────────────────
// Absolute minutes: 0 = midnight Apr26
// -1440 = midnight Apr25,  1440 = midnight Apr27,  2880 = midnight Apr28
const D = { d_1:-1440, d0:0, d1:1440, d2:2880 };

const BLOCKS = [
  // Apr 25
  { id:'sbor',        label:'Сбор',        color:'#818cf8', absFrom:D.d_1+420,  absTo:D.d_1+600  }, // 07:00–10:00
  { id:'zavoz',       label:'Завоз',       color:'#38bdf8', absFrom:D.d_1+480,  absTo:D.d_1+720  }, // 08:00–12:00
  { id:'montazh',     label:'Монтаж',      color:'#fbbf24', absFrom:D.d_1+600,  absTo:D.d_1+1200 }, // 10:00–20:00
  // Apr 26
  { id:'efir',        label:'Эфир',        color:'#34d399', absFrom:D.d0+1080,  absTo:D.d0+1320  }, // 18:00–22:00
  { id:'demontazh',   label:'Демонтаж',    color:'#f87171', absFrom:D.d0+1320,  absTo:D.d0+1560  }, // 22:00–02:00
  // Apr 27
  { id:'efir_2',      label:'Эфир',        color:'#2dd4bf', absFrom:D.d1+840,   absTo:D.d1+1080  }, // 14:00–18:00
  { id:'efir_3',      label:'Эфир',        color:'#38bdf8', absFrom:D.d1+1080,  absTo:D.d1+1320  }, // 18:00–22:00
  // Apr 28
  { id:'demontazh_2', label:'Демонтаж',    color:'#fb923c', absFrom:D.d2+540,   absTo:D.d2+840   }, // 09:00–14:00
  { id:'vyvoz',       label:'Вывоз',       color:'#c084fc', absFrom:D.d2+720,   absTo:D.d2+960   }, // 12:00–16:00
];

const ENTRIES = [
  // ── МОНТАЖНАЯ БРИГАДА ── Сбор + Монтаж + Демонтаж 1 + Демонтаж 2
  { bid:'sbor',        name:'Алексей Митюков',  absFrom:D.d_1+420,  absTo:D.d_1+570  },
  { bid:'montazh',     name:'Алексей Митюков',  absFrom:D.d_1+600,  absTo:D.d_1+1170 },
  { bid:'demontazh',   name:'Алексей Митюков',  absFrom:D.d0+1320,  absTo:D.d0+1530  },
  { bid:'demontazh_2', name:'Алексей Митюков',  absFrom:D.d2+540,   absTo:D.d2+840   },

  { bid:'sbor',        name:'Дмитрий Казаков',  absFrom:D.d_1+450,  absTo:D.d_1+600  },
  { bid:'montazh',     name:'Дмитрий Казаков',  absFrom:D.d_1+600,  absTo:D.d_1+1200 },
  { bid:'demontazh',   name:'Дмитрий Казаков',  absFrom:D.d0+1320,  absTo:D.d0+1560  },

  { bid:'montazh',     name:'Игорь Петров',     absFrom:D.d_1+660,  absTo:D.d_1+1200 },
  { bid:'demontazh',   name:'Игорь Петров',     absFrom:D.d0+1320,  absTo:D.d0+1560  },
  { bid:'demontazh_2', name:'Игорь Петров',     absFrom:D.d2+540,   absTo:D.d2+810   },

  // ── ТРАНСПОРТНАЯ БРИГАДА ── Завоз + Вывоз
  { bid:'zavoz',       name:'Сергей Громов',    absFrom:D.d_1+480,  absTo:D.d_1+720  },
  { bid:'vyvoz',       name:'Сергей Громов',    absFrom:D.d2+720,   absTo:D.d2+960   },

  { bid:'zavoz',       name:'Михаил Орлов',     absFrom:D.d_1+510,  absTo:D.d_1+720  },
  { bid:'vyvoz',       name:'Михаил Орлов',     absFrom:D.d2+750,   absTo:D.d2+960   },

  // ── ЭФИРНАЯ БРИГАДА ── Эфир 1/2/3
  { bid:'efir',        name:'Наталья Лебедева', absFrom:D.d0+1080,  absTo:D.d0+1320  },
  { bid:'efir_2',      name:'Наталья Лебедева', absFrom:D.d1+840,   absTo:D.d1+1080  },
  { bid:'efir_3',      name:'Наталья Лебедева', absFrom:D.d1+1080,  absTo:D.d1+1320  },

  { bid:'efir',        name:'Мария Соколова',   absFrom:D.d0+1080,  absTo:D.d0+1290  },
  { bid:'efir_2',      name:'Мария Соколова',   absFrom:D.d1+840,   absTo:D.d1+1080  },
  { bid:'efir_3',      name:'Мария Соколова',   absFrom:D.d1+1110,  absTo:D.d1+1320  },

  { bid:'efir',        name:'Константин Волков', absFrom:D.d0+1080, absTo:D.d0+1320  },

  { bid:'efir_2',      name:'Светлана Орлова',  absFrom:D.d1+870,   absTo:D.d1+1080  },
  { bid:'efir_3',      name:'Светлана Орлова',  absFrom:D.d1+1080,  absTo:D.d1+1320  },

  { bid:'efir',        name:'Виктор Семёнов',   absFrom:D.d0+1110,  absTo:D.d0+1320  },
  { bid:'efir_2',      name:'Виктор Семёнов',   absFrom:D.d1+840,   absTo:D.d1+1050  },
];

// ─── GROUP STRUCTURE ──────────────────────────────────────────────────────
const GROUPS = [
  { label:'Монтажная бригада', color:'#fbbf24', persons:['Алексей Митюков','Дмитрий Казаков','Игорь Петров'] },
  { label:'Транспортная',      color:'#38bdf8', persons:['Сергей Громов','Михаил Орлов'] },
  { label:'Эфирная бригада',   color:'#34d399', persons:['Наталья Лебедева','Мария Соколова','Константин Волков','Светлана Орлова','Виктор Семёнов'] },
];
const groupOf = Object.fromEntries(GROUPS.flatMap(g=>g.persons.map(p=>[p,g])));

const blockById = Object.fromEntries(BLOCKS.map(b=>[b.id,b]));

// ─── LAYOUT ───────────────────────────────────────────────────────────────
const BASE_PX=2.2, HANDLE_W=8, BAR_H=16, ROW_H_BASE=40, SECTION_H=26;
const DATE_ROW_H=20, BLOCK_TRACK_H=28, TICK_H=22;
let zoom=1.0;

let RANGE={start:0,end:1440}, BLOCK_TRACKS={}, NUM_BLOCK_TRACKS=1, HEADER_H=70;

const ppm    =()=>BASE_PX*zoom;
const minToPx=m=>(m-RANGE.start)*ppm();
const totalW =()=>(RANGE.end-RANGE.start)*ppm();

function computeAll() {
  const mins=BLOCKS.flatMap(b=>[b.absFrom,b.absTo]);
  RANGE={ start:Math.floor((Math.min(...mins)-90)/STEP)*STEP, end:Math.ceil((Math.max(...mins)+90)/STEP)*STEP };
  const sorted=[...BLOCKS].sort((a,b)=>a.absFrom-b.absFrom);
  const trackEnds=[]; BLOCK_TRACKS={};
  for (const b of sorted) {
    let placed=false;
    for (let t=0;t<trackEnds.length;t++) { if(trackEnds[t]<=b.absFrom){BLOCK_TRACKS[b.id]=t;trackEnds[t]=b.absTo;placed=true;break;} }
    if (!placed){BLOCK_TRACKS[b.id]=trackEnds.length;trackEnds.push(b.absTo);}
  }
  NUM_BLOCK_TRACKS=Math.max(1,trackEnds.length);
  HEADER_H=DATE_ROW_H+NUM_BLOCK_TRACKS*BLOCK_TRACK_H+TICK_H;
}

// ─── ROW BUILDING ─────────────────────────────────────────────────────────
function buildRows() {
  const rows=[];
  for (const g of GROUPS) {
    rows.push({type:'section',group:g});
    for (const name of g.persons) rows.push({type:'person',name,group:g});
  }
  return rows;
}
function personEntries(name) { return ENTRIES.filter(e=>e.name===name).sort((a,b)=>a.absFrom-b.absFrom); }
function assignTracks(entries) {
  const result=entries.map(e=>({...e})); const trackEnds=[];
  for (const e of result) {
    let placed=false;
    for (let t=0;t<trackEnds.length;t++){if(trackEnds[t]<=e.absFrom){e.track=t;trackEnds[t]=e.absTo;placed=true;break;}}
    if(!placed){e.track=trackEnds.length;trackEnds.push(e.absTo);}
  }
  return {entries:result,numTracks:Math.max(1,trackEnds.length)};
}
function rowH(name) { const {numTracks}=assignTracks(personEntries(name)); return Math.max(ROW_H_BASE,numTracks*(BAR_H+8)+10); }
function totalH() {
  return buildRows().reduce((s,r)=>s+(r.type==='section'?SECTION_H:rowH(r.name)),0);
}

// ─── SCROLL SYNC ──────────────────────────────────────────────────────────
const tracksEl=document.getElementById('tracksScroll');
const headerEl=document.getElementById('headerScroll');
const namesEl =document.getElementById('namesScroll');
tracksEl.addEventListener('scroll',()=>{ headerEl.scrollLeft=tracksEl.scrollLeft; namesEl.scrollTop=tracksEl.scrollTop; });

// ─── FULL RENDER ──────────────────────────────────────────────────────────
function render(preserveScroll=true) {
  const savedL=tracksEl.scrollLeft, savedT=tracksEl.scrollTop;
  computeAll();
  document.getElementById('planner').style.gridTemplateRows=`${HEADER_H}px 1fr`;
  document.getElementById('corner').style.height=HEADER_H+'px';
  headerEl.style.height=HEADER_H+'px';
  const W=totalW(), H=totalH();
  renderHeader(W); renderNames(H); renderTracks(W,H);
  if (preserveScroll){tracksEl.scrollLeft=savedL;tracksEl.scrollTop=savedT;headerEl.scrollLeft=savedL;namesEl.scrollTop=savedT;}
}

// ─── RENDER HEADER ────────────────────────────────────────────────────────
function renderHeader(W) {
  const el=document.getElementById('headerInner');
  el.style.width=W+'px'; el.style.height=HEADER_H+'px';
  let html='';

  // date strip
  for (let day=dayOf(RANGE.start);day<=dayOf(RANGE.end)+1;day++) {
    const absS=day*1440,absE=(day+1)*1440,visS=Math.max(absS,RANGE.start),visE=Math.min(absE,RANGE.end);
    if(visS>=visE) continue;
    const x=minToPx(visS),w=minToPx(visE)-x;
    html+=`<div style="position:absolute;top:0;left:${x}px;width:${w}px;height:${DATE_ROW_H}px;
      display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
      color:#64748b;border-right:1px solid #1e293b;">${dateFull(absS+12*60)}</div>`;
    if(absS>RANGE.start&&absS<RANGE.end)
      html+=`<div style="position:absolute;top:${DATE_ROW_H}px;left:${minToPx(absS)}px;width:2px;
        height:${HEADER_H-DATE_ROW_H}px;background:#1e3a5f;pointer-events:none;z-index:5;"></div>`;
  }

  // block bars
  for (const b of BLOCKS) {
    const track=BLOCK_TRACKS[b.id]??0, by2=DATE_ROW_H+track*BLOCK_TRACK_H+3, bh=BLOCK_TRACK_H-6;
    const x=minToPx(b.absFrom), w=(b.absTo-b.absFrom)*ppm();
    html+=`
    <div id="hbar-${b.id}" style="position:absolute;top:${by2}px;left:${x}px;width:${w}px;height:${bh}px;
      background:${b.color}28;border:1.5px solid ${b.color}66;border-radius:6px;overflow:visible;user-select:none;z-index:2;">
      <div class="blk-move" data-bid="${b.id}" style="position:absolute;inset:0;cursor:grab;border-radius:6px;z-index:1;"></div>
      <div class="blk-resize" data-bid="${b.id}" data-side="absFrom"
        style="position:absolute;left:-6px;top:0;width:14px;height:100%;cursor:ew-resize;z-index:3;display:flex;align-items:center;justify-content:center;">
        <div style="width:4px;height:${bh-4}px;background:${b.color};border-radius:2px;opacity:.8;pointer-events:none;"></div>
      </div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        pointer-events:none;gap:4px;overflow:hidden;padding:0 14px;">
        <span style="font-size:11px;font-weight:600;color:${b.color};white-space:nowrap;">${b.label}</span>
        <span class="blk-time" style="font-size:10px;color:${b.color};opacity:.65;white-space:nowrap;">${timeOfDay(b.absFrom)}–${timeOfDay(b.absTo)}</span>
        <span class="blk-date" style="font-size:10px;color:${b.color};opacity:.4;white-space:nowrap;">${dateLabel(b.absFrom)}</span>
      </div>
      <div class="blk-resize" data-bid="${b.id}" data-side="absTo"
        style="position:absolute;right:-6px;top:0;width:14px;height:100%;cursor:ew-resize;z-index:3;display:flex;align-items:center;justify-content:center;">
        <div style="width:4px;height:${bh-4}px;background:${b.color};border-radius:2px;opacity:.8;pointer-events:none;"></div>
      </div>
    </div>`;
  }

  // hour ticks
  const tickY=DATE_ROW_H+NUM_BLOCK_TRACKS*BLOCK_TRACK_H;
  for (let t=RANGE.start;t<=RANGE.end;t+=STEP) {
    const x=minToPx(t),isH=t%60===0,isMid=((t%1440)+1440)%1440===0;
    if(isMid) continue; // midnight already marked
    html+=`<div style="position:absolute;top:${tickY}px;left:${x}px;transform:translateX(-50%);">
      <div style="height:${isH?10:5}px;width:1px;background:${isH?'#334155':'#1e293b'};margin:0 auto;"></div>
      ${isH?`<div style="font-size:10px;color:#475569;text-align:center;">${timeOfDay(t)}</div>`:''}
    </div>`;
  }

  el.innerHTML=html;
  el.querySelectorAll('.blk-move').forEach(el=>el.addEventListener('pointerdown',onBlockMoveDown));
  el.querySelectorAll('.blk-resize').forEach(el=>el.addEventListener('pointerdown',onBlockResizeDown));
}

// ─── RENDER NAMES ─────────────────────────────────────────────────────────
function renderNames(H) {
  const el=document.getElementById('namesInner');
  el.style.height=H+'px';
  let html='';
  for (const row of buildRows()) {
    if (row.type==='section') {
      html+=`<div class="name-section" style="height:${SECTION_H}px;color:${row.group.color};">
        <div style="width:3px;height:12px;background:${row.group.color};border-radius:2px;margin-right:8px;flex-shrink:0;"></div>
        ${row.group.label}
      </div>`;
    } else {
      const g=row.group, h=rowH(row.name);
      html+=`<div class="name-row" data-name="${row.name}" style="height:${h}px;" title="Двойной клик — подогнать бары под блок">
        <div class="name-accent" style="background:${g.color}55;height:100%;"></div>
        ${row.name}
      </div>`;
    }
  }
  el.innerHTML=html;
  el.querySelectorAll('.name-row').forEach(r=>r.addEventListener('dblclick',()=>snapPerson(r.dataset.name)));
}

// ─── RENDER TRACKS ────────────────────────────────────────────────────────
function renderTracks(W,H) {
  const el=document.getElementById('tracksInner');
  el.style.width=W+'px'; el.style.height=H+'px';
  let html='';

  // vertical grid + day boundaries
  for (let t=RANGE.start;t<=RANGE.end;t+=STEP) {
    const x=minToPx(t),isH=t%60===0,isMid=((t-RANGE.start)%1440===0&&t!==RANGE.start)||t%1440===0;
    html+=`<div style="position:absolute;top:0;left:${x}px;width:${isMid?2:1}px;height:100%;
      background:${isMid?'#334155':isH?'#182540':'#0e1a2e'};pointer-events:none;"></div>`;
  }

  // block bg bands
  for (const b of BLOCKS) {
    const x=minToPx(b.absFrom),w=(b.absTo-b.absFrom)*ppm();
    html+=`<div id="tbg-${b.id}" style="position:absolute;top:0;left:${x}px;width:${w}px;height:100%;
      background:${b.color}07;border-left:1px solid ${b.color}20;pointer-events:none;"></div>`;
  }

  // rows
  let y=0;
  for (const row of buildRows()) {
    if (row.type==='section') {
      // section bg
      html+=`<div style="position:absolute;top:${y}px;left:0;width:100%;height:${SECTION_H}px;
        background:#0a122033;border-bottom:1px solid #1a2540;pointer-events:none;"></div>`;
      y+=SECTION_H; continue;
    }

    const {name,group:g}=row, rh=rowH(name);
    const pEntries=personEntries(name);
    const {entries:tracked,numTracks}=assignTracks(pEntries);
    const trackPitch=numTracks===1?rh:Math.floor((rh-8)/numTracks);

    // row bg stripe per group
    html+=`<div style="position:absolute;top:${y}px;left:0;width:4px;height:${rh}px;
      background:${g.color}44;pointer-events:none;"></div>`;

    // connector line: earliest → latest bar
    if (pEntries.length>1) {
      const lx=minToPx(pEntries[0].absFrom), rx=minToPx(pEntries[pEntries.length-1].absTo);
      html+=`<div id="conn-${safeName(name)}" style="position:absolute;top:${y+rh/2}px;left:${lx}px;
        width:${rx-lx}px;height:1px;background:#1e3a5f;pointer-events:none;"></div>`;
      // dots at connection points
      pEntries.forEach(pe=>{
        const px=minToPx(pe.absFrom), pw=(pe.absTo-pe.absFrom)*ppm();
        html+=`<div style="position:absolute;top:${y+rh/2-2.5}px;left:${px-2.5}px;width:5px;height:5px;
          border-radius:50%;background:#334155;pointer-events:none;"></div>`;
        html+=`<div style="position:absolute;top:${y+rh/2-2.5}px;left:${px+pw-2.5}px;width:5px;height:5px;
          border-radius:50%;background:#334155;pointer-events:none;"></div>`;
      });
    }

    // member bars
    for (const te of tracked) {
      const eIdx=ENTRIES.findIndex(e=>e.bid===te.bid&&e.name===te.name);
      const e=ENTRIES[eIdx], b=blockById[e.bid];
      const barCY=numTracks===1?y+rh/2:y+4+te.track*trackPitch+trackPitch/2;
      const by2=barCY-BAR_H/2, bx=minToPx(e.absFrom), bw=(e.absTo-e.absFrom)*ppm();
      html+=`
      <div id="mbar-${eIdx}" style="position:absolute;top:${by2}px;left:${bx}px;width:${bw}px;height:${BAR_H}px;
        background:${b.color};border-radius:4px;opacity:.92;user-select:none;overflow:visible;">
        <div class="mresize" data-eidx="${eIdx}" data-side="absFrom"
          style="position:absolute;left:0;top:0;width:${HANDLE_W}px;height:100%;cursor:ew-resize;
            background:rgba(0,0,0,.35);border-radius:4px 0 0 4px;z-index:2;"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
          padding:0 ${HANDLE_W+2}px;pointer-events:none;overflow:hidden;">
          <span class="mbar-from" style="font-size:9px;color:#fff;opacity:.9;">${timeOfDay(e.absFrom)}</span>
          <span style="font-size:9px;color:#fff;font-weight:600;opacity:.6;white-space:nowrap;">${b.label}</span>
          <span class="mbar-to" style="font-size:9px;color:#fff;opacity:.9;">${timeOfDay(e.absTo)}</span>
        </div>
        <div class="mresize" data-eidx="${eIdx}" data-side="absTo"
          style="position:absolute;right:0;top:0;width:${HANDLE_W}px;height:100%;cursor:ew-resize;
            background:rgba(0,0,0,.35);border-radius:0 4px 4px 0;z-index:2;"></div>
      </div>`;
    }
    html+=`<div style="position:absolute;top:${y+rh-1}px;left:0;width:100%;height:1px;background:#1a2540;pointer-events:none;"></div>`;
    y+=rh;
  }

  el.innerHTML=html;
  el.querySelectorAll('.mresize').forEach(h=>h.addEventListener('pointerdown',onMemberResizeDown));
}

// ─── DRAG HELPERS ─────────────────────────────────────────────────────────
function startDrag(){document.body.style.cursor='grabbing';}
function endDrag()  {document.body.style.cursor='';}
function updateHbarDOM(b){
  const el=document.getElementById(`hbar-${b.id}`); if(!el)return;
  el.style.left=minToPx(b.absFrom)+'px'; el.style.width=(b.absTo-b.absFrom)*ppm()+'px';
  const t=el.querySelector('.blk-time'), d=el.querySelector('.blk-date');
  if(t) t.textContent=`${timeOfDay(b.absFrom)}–${timeOfDay(b.absTo)}`;
  if(d) d.textContent=dateLabel(b.absFrom);
}
function updateTbgDOM(b){
  const el=document.getElementById(`tbg-${b.id}`); if(!el)return;
  el.style.left=minToPx(b.absFrom)+'px'; el.style.width=(b.absTo-b.absFrom)*ppm()+'px';
}
function updateMbarDOM(eIdx){
  const e=ENTRIES[eIdx], el=document.getElementById(`mbar-${eIdx}`); if(!el)return;
  el.style.left=minToPx(e.absFrom)+'px'; el.style.width=(e.absTo-e.absFrom)*ppm()+'px';
  const f=el.querySelector('.mbar-from'), t=el.querySelector('.mbar-to');
  if(f) f.textContent=timeOfDay(e.absFrom); if(t) t.textContent=timeOfDay(e.absTo);
}
function updateConnDOM(name){
  const pe=personEntries(name); if(pe.length<2)return;
  const lx=minToPx(pe[0].absFrom), rx=minToPx(pe[pe.length-1].absTo);
  const el=document.getElementById(`conn-${safeName(name)}`);
  if(el){el.style.left=lx+'px';el.style.width=(rx-lx)+'px';}
}

// ─── BLOCK MOVE ───────────────────────────────────────────────────────────
function onBlockMoveDown(e){
  e.preventDefault(); e.stopPropagation();
  const bid=e.currentTarget.dataset.bid, block=BLOCKS.find(b=>b.id===bid);
  const startX=e.clientX, origFrom=block.absFrom, origTo=block.absTo;
  let moved=false;
  const snap=ENTRIES.map((en,idx)=>en.bid===bid?{en,idx,mf:en.absFrom,mt:en.absTo}:null).filter(Boolean);
  const names=[...new Set(snap.map(s=>s.en.name))];
  function onMove(ev){
    const dx=ev.clientX-startX;
    if(!moved&&Math.abs(dx)>5){moved=true;startDrag();}
    if(!moved)return;
    const shift=Math.round(dx/ppm()/STEP)*STEP;
    block.absFrom=origFrom+shift; block.absTo=origTo+shift;
    snap.forEach(({en,mf,mt})=>{en.absFrom=mf+shift;en.absTo=mt+shift;});
    updateHbarDOM(block); updateTbgDOM(block);
    snap.forEach(({idx})=>updateMbarDOM(idx));
    names.forEach(updateConnDOM);
    showTip(ev,`${dateLabel(block.absFrom)}  ${timeOfDay(block.absFrom)} – ${timeOfDay(block.absTo)}`);
  }
  function onUp(ev){
    endDrag(); hideTip();
    document.removeEventListener('pointermove',onMove); document.removeEventListener('pointerup',onUp);
    if(moved) render(); else showBlockPopup(bid,ev);
  }
  document.addEventListener('pointermove',onMove); document.addEventListener('pointerup',onUp);
}

// ─── BLOCK RESIZE ─────────────────────────────────────────────────────────
function onBlockResizeDown(e){
  e.preventDefault(); e.stopPropagation();
  const bid=e.currentTarget.dataset.bid, side=e.currentTarget.dataset.side;
  const block=BLOCKS.find(b=>b.id===bid), startX=e.clientX, origVal=block[side];
  function onMove(ev){
    const dx=ev.clientX-startX; let v=Math.round((origVal+dx/ppm())/STEP)*STEP;
    if(side==='absFrom') v=Math.max(block.absTo-20*60,Math.min(v,block.absTo-STEP));
    else                 v=Math.max(block.absFrom+STEP,Math.min(v,block.absFrom+20*60));
    block[side]=v; updateHbarDOM(block); updateTbgDOM(block); showTip(ev,timeOfDay(v));
  }
  function onUp(){
    hideTip(); document.removeEventListener('pointermove',onMove); document.removeEventListener('pointerup',onUp);
    ENTRIES.filter(en=>en.bid===bid).forEach(en=>{
      en.absFrom=Math.max(block.absFrom,Math.min(en.absFrom,block.absTo-STEP));
      en.absTo=Math.max(en.absFrom+STEP,Math.min(en.absTo,block.absTo));
    }); render();
  }
  document.addEventListener('pointermove',onMove); document.addEventListener('pointerup',onUp);
}

// ─── MEMBER RESIZE ────────────────────────────────────────────────────────
function onMemberResizeDown(e){
  e.preventDefault(); e.stopPropagation();
  const eIdx=parseInt(e.currentTarget.dataset.eidx,10), side=e.currentTarget.dataset.side;
  const entry=ENTRIES[eIdx], block=blockById[entry.bid];
  const startX=e.clientX, origVal=entry[side];
  function onMove(ev){
    const dx=ev.clientX-startX; let v=Math.round((origVal+dx/ppm())/STEP)*STEP;
    if(side==='absFrom') v=Math.max(block.absFrom,Math.min(v,entry.absTo-STEP));
    else                 v=Math.max(entry.absFrom+STEP,Math.min(v,block.absTo));
    entry[side]=v; updateMbarDOM(eIdx); updateConnDOM(entry.name); showTip(ev,timeOfDay(v));
  }
  function onUp(){hideTip();document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);render();}
  document.addEventListener('pointermove',onMove); document.addEventListener('pointerup',onUp);
}

// ─── SNAP PERSON ──────────────────────────────────────────────────────────
function snapPerson(name){
  ENTRIES.filter(e=>e.name===name).forEach(e=>{const b=blockById[e.bid];e.absFrom=b.absFrom;e.absTo=b.absTo;});
  render();
}

// ─── BLOCK DATE POPUP ─────────────────────────────────────────────────────
let _popupBid=null;
const popup=document.getElementById('block-popup');
function showBlockPopup(bid,ev){
  _popupBid=bid; const b=BLOCKS.find(x=>x.id===bid);
  document.getElementById('popup-title').textContent=b.label;
  document.getElementById('popup-title').style.color=b.color;
  document.getElementById('popup-date-label').textContent=dateFull(b.absFrom);
  document.getElementById('popup-time').textContent=`${timeOfDay(b.absFrom)} – ${timeOfDay(b.absTo)}`;
  popup.style.display='block';
  popup.style.left=Math.max(8,Math.min(ev.clientX-100,window.innerWidth-220))+'px';
  popup.style.top=Math.max(8,Math.min(ev.clientY+10,window.innerHeight-160))+'px';
}
function changeDay(delta){
  if(!_popupBid)return;
  const b=BLOCKS.find(x=>x.id===_popupBid), shift=delta*1440;
  b.absFrom+=shift; b.absTo+=shift;
  ENTRIES.filter(e=>e.bid===_popupBid).forEach(e=>{e.absFrom+=shift;e.absTo+=shift;});
  document.getElementById('popup-date-label').textContent=dateFull(b.absFrom);
  document.getElementById('popup-time').textContent=`${timeOfDay(b.absFrom)} – ${timeOfDay(b.absTo)}`;
  render();
}
document.getElementById('popupPrev').onclick=()=>changeDay(-1);
document.getElementById('popupNext').onclick=()=>changeDay(+1);
document.getElementById('popupClose').onclick=()=>{popup.style.display='none';_popupBid=null;};
document.addEventListener('pointerdown',e=>{if(popup.style.display!=='none'&&!popup.contains(e.target)){popup.style.display='none';_popupBid=null;}});

// ─── TOOLTIP ──────────────────────────────────────────────────────────────
const tipEl=document.getElementById('drag-tip');
function showTip(e,txt){tipEl.textContent=txt;tipEl.style.display='block';moveTip(e);}
function hideTip(){tipEl.style.display='none';}
function moveTip(e){tipEl.style.left=(e.clientX+14)+'px';tipEl.style.top=(e.clientY-10)+'px';}
document.addEventListener('pointermove',e=>{if(tipEl.style.display!=='none')moveTip(e);});

// ─── ZOOM ─────────────────────────────────────────────────────────────────
document.getElementById('zoomIn').onclick =()=>setZoom(zoom*1.3);
document.getElementById('zoomOut').onclick=()=>setZoom(zoom/1.3);
function setZoom(z){
  const prevW=totalW(),prevL=tracksEl.scrollLeft+tracksEl.clientWidth/2;
  zoom=Math.max(0.18,Math.min(6,z));
  render(false);
  tracksEl.scrollLeft=prevL/prevW*totalW()-tracksEl.clientWidth/2;
  headerEl.scrollLeft=tracksEl.scrollLeft;
  document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%';
}
tracksEl.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey){
    e.preventDefault();
    const rect=tracksEl.getBoundingClientRect(), ratio=(e.clientX-rect.left+tracksEl.scrollLeft)/totalW();
    zoom=Math.max(0.18,Math.min(6,zoom*(e.deltaY<0?1.15:1/1.15)));
    render(false);
    tracksEl.scrollLeft=ratio*totalW()-(e.clientX-rect.left);
    headerEl.scrollLeft=tracksEl.scrollLeft;
    document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%';
  }
},{passive:false});

render(false);
requestAnimationFrame(()=>{
  const x=Math.max(0,minToPx(BLOCKS[0].absFrom)-60);
  tracksEl.scrollLeft=x; headerEl.scrollLeft=x;
});
</script>
