<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Workflow — мокап</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; font-size: 14px; user-select: none; }

/* ── Layout ── */
.page { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.page-header { padding: 14px 24px 0; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-body { flex: 1; display: flex; flex-direction: column; padding: 16px 24px 24px; gap: 16px; overflow: hidden; }

/* ── Pipeline bar ── */
.pipeline { flex-shrink: 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px 20px; }
.pipeline-row { display: flex; align-items: center; gap: 6px; }
.pipeline-extras { display: flex; gap: 8px; margin-top: 10px; padding-left: 4px; }

.stage {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 10px; cursor: pointer;
  border: 2px solid transparent; transition: all .15s;
  font-weight: 600; font-size: 13px; position: relative;
  white-space: nowrap;
}
.stage .count {
  background: rgba(255,255,255,.35); border-radius: 20px;
  padding: 1px 8px; font-size: 12px; font-weight: 700;
}
.stage.request  { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
.stage.request.active  { background: #2563eb; color: #fff; border-color: #2563eb; }
.stage.request.active .count { background: rgba(255,255,255,.25); }

.stage.production { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
.stage.production.active { background: #16a34a; color: #fff; border-color: #16a34a; }

.stage.delivered { background: #f5f3ff; color: #7c3aed; border-color: #ddd6fe; }
.stage.delivered.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

.stage.rejected-stage { background: #fef2f2; color: #dc2626; border-color: #fecaca; font-size: 12px; padding: 7px 14px; }
.stage.rejected-stage.active { background: #dc2626; color: #fff; border-color: #dc2626; }

.stage.drag-over { transform: scale(1.04); box-shadow: 0 0 0 3px #3b82f6; }
.stage.drag-over.rejected-stage { box-shadow: 0 0 0 3px #ef4444; }

.arrow { color: #94a3b8; font-size: 18px; flex-shrink: 0; }

/* ── Table wrapper ── */
.table-wrap {
  flex: 1; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
  overflow: auto; position: relative;
}
.table-toolbar {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  border-bottom: 1px solid #e2e8f0; background: #fff;
  position: sticky; top: 0; z-index: 10;
}
.toolbar-label { font-size: 13px; font-weight: 600; color: #374151; }
.toolbar-count { font-size: 12px; color: #94a3b8; }
.btn-add { margin-left: auto; padding: 6px 14px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-add:hover { background: #1d4ed8; }

/* ── Table ── */
table { width: 100%; border-collapse: collapse; min-width: 1100px; }
thead th {
  padding: 9px 12px; text-align: left; font-size: 12px; font-weight: 600;
  color: #64748b; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
  white-space: nowrap; position: sticky; top: 52px; z-index: 5;
}
thead th:first-child { width: 28px; padding: 9px 6px 9px 12px; }
tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .1s; }
tbody tr:hover { background: #f8fafc; }
tbody tr.dragging { opacity: .4; background: #e0f2fe; }
tbody tr.drag-target-above td:first-child::before { content: ''; display: block; height: 2px; background: #3b82f6; position: absolute; left: 0; right: 0; top: -1px; }
td { padding: 8px 12px; font-size: 13px; vertical-align: middle; }
td:first-child { padding: 8px 6px 8px 12px; }

.drag-handle {
  cursor: grab; color: #cbd5e1; font-size: 16px; letter-spacing: -2px;
  display: inline-block; padding: 2px 4px; border-radius: 4px;
  transition: color .15s;
  line-height: 1;
}
.drag-handle:hover { color: #94a3b8; background: #f1f5f9; }
.drag-handle:active { cursor: grabbing; }

/* ── Status badge ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.badge.request     { background: #dbeafe; color: #1d4ed8; }
.badge.negotiation { background: #e0f2fe; color: #0369a1; }
.badge.preproduction { background: #fef9c3; color: #a16207; }
.badge.production    { background: #dcfce7; color: #15803d; }
.badge.postproduction{ background: #f0fdf4; color: #16a34a; }
.badge.delivered     { background: #f5f3ff; color: #6d28d9; }
.badge.rejected      { background: #fee2e2; color: #b91c1c; }
.badge.cancelled     { background: #f1f5f9; color: #64748b; }

/* ── Inline cell editors ── */
.cell-input {
  width: 100%; border: none; background: transparent; font-size: 13px;
  font-family: inherit; color: inherit; outline: none; padding: 0;
}
.cell-input:focus { background: #f0f9ff; border-radius: 4px; padding: 2px 6px; margin: -2px -6px; outline: 1px solid #93c5fd; }
.cell-select {
  border: none; background: transparent; font-size: 13px;
  font-family: inherit; color: inherit; outline: none; cursor: pointer;
  width: 100%; padding: 0;
}
.cell-select:focus { background: #f0f9ff; border-radius: 4px; padding: 2px 4px; outline: 1px solid #93c5fd; }

/* ── Smart date display ── */
.date-display { color: #0369a1; font-weight: 500; }
.date-raw { color: #94a3b8; font-size: 11px; }

/* ── Add row ── */
.add-row-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border: none; background: transparent;
  color: #94a3b8; font-size: 13px; cursor: pointer; width: 100%;
  border-top: 1px dashed #e2e8f0;
  transition: all .15s;
}
.add-row-btn:hover { color: #2563eb; background: #f0f9ff; }
.add-row-btn .plus { font-size: 18px; line-height: 1; }

/* ── Ghost (dragging) ── */
#ghost {
  position: fixed; pointer-events: none; z-index: 9999;
  background: #fff; border: 2px solid #3b82f6; border-radius: 8px;
  padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
  font-size: 13px; min-width: 200px; max-width: 320px;
  opacity: 0; transition: opacity .1s;
}
#ghost.visible { opacity: 1; }

/* ── Tooltip ── */
.tooltip { position: fixed; background: #1e293b; color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 6px; pointer-events: none; z-index: 999; }
</style>
</head>
<body>

<div id="ghost"></div>

<div class="page">
  <div class="page-header">
    <h1>Workflow</h1>
    <span style="font-size:13px;color:#94a3b8;">Воронка задач</span>
  </div>

  <div class="page-body">

    <!-- ── Pipeline ── -->
    <div class="pipeline">
      <div class="pipeline-row">
        <div class="stage request active" data-stage="request" onclick="selectStage('request')">
          <span>Запрос</span>
          <span class="count" id="cnt-request">0</span>
        </div>
        <div class="arrow">→</div>
        <div class="stage production" data-stage="production" onclick="selectStage('production')">
          <span>Производство</span>
          <span class="count" id="cnt-production">0</span>
        </div>
        <div class="arrow">→</div>
        <div class="stage delivered" data-stage="delivered" onclick="selectStage('delivered')">
          <span>Сдан</span>
          <span class="count" id="cnt-delivered">0</span>
        </div>
      </div>
      <div class="pipeline-extras">
        <div class="stage rejected-stage" data-stage="rejected" onclick="selectStage('rejected')">
          ✕ Не согласован
          <span class="count" id="cnt-rejected">0</span>
        </div>
        <div class="stage rejected-stage" data-stage="cancelled" onclick="selectStage('cancelled')">
          ○ Отменён
          <span class="count" id="cnt-cancelled">0</span>
        </div>
      </div>
    </div>

    <!-- ── Table ── -->
    <div class="table-wrap">
      <div class="table-toolbar">
        <span class="toolbar-label" id="stage-label">Запрос</span>
        <span class="toolbar-count" id="stage-count"></span>
        <button class="btn-add" onclick="addRow()">+ Добавить строку</button>
      </div>
      <table id="main-table">
        <thead>
          <tr>
            <th></th>
            <th>Статус</th>
            <th>Клиент</th>
            <th>Описание</th>
            <th>Исп. продюсер</th>
            <th>Лин. продюсер</th>
            <th>Аккаунт менеджер</th>
            <th>Дата</th>
            <th>Формат</th>
            <th>Локация</th>
            <th>Проект</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <button class="add-row-btn" onclick="addRow()">
        <span class="plus">+</span> Новая строка
      </button>
    </div>

  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────

const FORMATS = ['ТВ', 'Радио', 'Телерадио', 'Продакшн', 'Дизайн', 'Оффлайн', 'Виртуальный', 'Менеджмент']
const LOCATIONS = ['Знаменка', 'Крыша Чёрный', 'Камин', 'Романов', 'Выезд']
const CLIENTS = ['Сбербанк', 'МТС', 'Яндекс', 'Газпром', 'Росатом', 'ВТБ', 'Тинькофф']
const PEOPLE = ['Иванов А.', 'Петрова М.', 'Сидоров К.', 'Козлова Е.', 'Смирнов Д.', 'Новикова О.']

const PROJECTS_BY_CLIENT = {
  'Сбербанк': ['Корпоратив 2025', 'Онлайн-конференция'],
  'МТС': ['Презентация тарифов', 'Ивент Москва'],
  'Яндекс': ['Конференция Я.Облако'],
  'Газпром': [],
  'Росатом': ['Форум-2025'],
  'ВТБ': ['Годовое собрание', 'Банковский форум'],
  'Тинькофф': ['Тинькофф Джаз'],
}

// Stage → statuses mapping
const STAGE_STATUSES = {
  request:    ['request', 'negotiation'],
  production: ['preproduction', 'production', 'postproduction'],
  delivered:  ['delivered'],
  rejected:   ['rejected'],
  cancelled:  ['cancelled'],
}

// Status → stage
function statusToStage(s) {
  for (const [stage, statuses] of Object.entries(STAGE_STATUSES)) {
    if (statuses.includes(s)) return stage
  }
  return 'request'
}

const STATUS_LABELS = {
  request: 'Запрос', negotiation: 'На согласовании',
  preproduction: 'Pre-production', production: 'Production',
  postproduction: 'Post-production', delivered: 'Сдан',
  rejected: 'Не согласован', cancelled: 'Отменён',
}

const STAGE_LABELS = {
  request: 'Запрос', production: 'Производство', delivered: 'Сдан',
  rejected: 'Не согласован', cancelled: 'Отменён',
}

// ── Rows ─────────────────────────────────────────────────────────────────────

let uid = 1
function makeRow(overrides = {}) {
  return {
    id: uid++,
    status: 'request',
    client: '',
    description: '',
    execProducer: '',
    lineProducer: '',
    accountManager: '',
    dateRaw: '',
    format: '',
    location: '',
    project: '',
    ...overrides,
  }
}

let rows = [
  makeRow({ status: 'request',       client: 'Сбербанк', description: 'Корпоративный ивент Q2', execProducer: 'Иванов А.', lineProducer: 'Петрова М.', format: 'ТВ',      location: 'Знаменка',    dateRaw: '14-20 мая',    project: 'Корпоратив 2025' }),
  makeRow({ status: 'negotiation',   client: 'МТС',       description: 'Презентация нового тарифа', execProducer: 'Сидоров К.', lineProducer: '', format: 'Продакшн', location: 'Выезд',       dateRaw: '3, 4, 5 июня', project: '' }),
  makeRow({ status: 'preproduction', client: 'Яндекс',    description: 'Облачная конференция 2025', execProducer: 'Козлова Е.', lineProducer: 'Смирнов Д.', format: 'ТВ', location: 'Романов',     dateRaw: 'июль',         project: 'Конференция Я.Облако' }),
  makeRow({ status: 'production',    client: 'Росатом',   description: 'Форум по атомной энергии',  execProducer: 'Иванов А.', lineProducer: 'Новикова О.', format: 'Оффлайн', location: 'Крыша Чёрный', dateRaw: '28 мая',    project: 'Форум-2025' }),
  makeRow({ status: 'postproduction',client: 'ВТБ',       description: 'Годовое акционерное собрание', execProducer: 'Петрова М.', lineProducer: '', format: 'Продакшн', location: 'Знаменка', dateRaw: '10 апр',     project: 'Годовое собрание' }),
  makeRow({ status: 'delivered',     client: 'Тинькофф',  description: 'Джазовый фестиваль',       execProducer: 'Козлова Е.', lineProducer: 'Смирнов Д.', format: 'Оффлайн', location: 'Выезд',  dateRaw: '2 апр',      project: 'Тинькофф Джаз' }),
  makeRow({ status: 'rejected',      client: 'Газпром',   description: 'Конференция партнёров',    execProducer: '', lineProducer: '', format: 'ТВ', location: '', dateRaw: 'март', project: '' }),
]

// ── Active stage ──────────────────────────────────────────────────────────────

let activeStage = 'request'

function visibleRows() {
  return rows.filter(r => statusToStage(r.status) === activeStage)
}

// ── Smart date ────────────────────────────────────────────────────────────────

const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек']
const MONTHS_FULL = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь']

function parseSmartDate(raw) {
  if (!raw) return { display: '', hint: '' }
  raw = raw.trim()

  // Just a month name
  for (const m of [...MONTHS_FULL, ...MONTHS]) {
    if (raw.toLowerCase() === m.toLowerCase()) {
      return { display: '📅 ' + raw, hint: 'месяц' }
    }
  }

  // Range: "14-20 мая" or "14–20 мая"
  const rangeM = raw.match(/^(\d{1,2})[–\-](\d{1,2})\s*(\S+)?$/)
  if (rangeM) {
    const [,d1,d2,mon] = rangeM
    return { display: `↔ ${d1}–${d2}${mon ? ' ' + mon : ''}`, hint: 'диапазон' }
  }

  // Multiple dates: "14, 18, 25 апр"
  const multiM = raw.match(/^(\d{1,2}(?:,\s*\d{1,2})+)\s*(\S+)?$/)
  if (multiM) {
    return { display: `◆ ${raw}`, hint: 'несколько дат' }
  }

  // Single date: "28 мая" or "3 апр"
  const singleM = raw.match(/^(\d{1,2})\s+(\S+)$/)
  if (singleM) {
    return { display: `● ${singleM[1]} ${singleM[2]}`, hint: 'дата' }
  }

  return { display: raw, hint: '' }
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  updateCounts()
  updateStageUI()
  renderTable()
}

function updateCounts() {
  for (const stage of Object.keys(STAGE_STATUSES)) {
    const n = rows.filter(r => statusToStage(r.status) === stage).length
    const el = document.getElementById('cnt-' + stage)
    if (el) el.textContent = n
  }
}

function updateStageUI() {
  // Stage buttons
  document.querySelectorAll('.stage').forEach(el => {
    el.classList.toggle('active', el.dataset.stage === activeStage)
  })
  // Toolbar
  const visible = visibleRows()
  document.getElementById('stage-label').textContent = STAGE_LABELS[activeStage] || ''
  document.getElementById('stage-count').textContent = `${visible.length} записей`
}

function renderTable() {
  const tbody = document.getElementById('table-body')
  const visible = visibleRows()
  tbody.innerHTML = ''

  for (const row of visible) {
    const tr = document.createElement('tr')
    tr.dataset.id = row.id
    tr.innerHTML = rowHTML(row)
    tbody.appendChild(tr)

    // Drag handle
    tr.querySelector('.drag-handle').addEventListener('mousedown', (e) => startDrag(e, row.id))
  }
}

function rowHTML(row) {
  const { display, hint } = parseSmartDate(row.dateRaw)
  const projects = (PROJECTS_BY_CLIENT[row.client] || [])
  const statuses = STAGE_STATUSES[statusToStage(row.status)] || []

  const statusOpts = statuses.map(s =>
    `<option value="${s}" ${row.status===s?'selected':''}>${STATUS_LABELS[s]}</option>`
  ).join('')

  const clientOpts = ['', ...CLIENTS].map(c =>
    `<option value="${c}" ${row.client===c?'selected':''}>${c || '— выберите —'}</option>`
  ).join('')

  const peopleOpts = ['', ...PEOPLE].map(p =>
    `<option value="${p}" ${row.execProducer===p?'selected':''}>${p || '—'}</option>`
  ).join('')
  const linePeopleOpts = ['', ...PEOPLE].map(p =>
    `<option value="${p}" ${row.lineProducer===p?'selected':''}>${p || '—'}</option>`
  ).join('')
  const amOpts = ['', ...PEOPLE].map(p =>
    `<option value="${p}" ${row.accountManager===p?'selected':''}>${p || '—'}</option>`
  ).join('')

  const fmtOpts = ['', ...FORMATS].map(f =>
    `<option value="${f}" ${row.format===f?'selected':''}>${f || '—'}</option>`
  ).join('')

  const locOpts = ['', ...LOCATIONS].map(l =>
    `<option value="${l}" ${row.location===l?'selected':''}>${l || '—'}</option>`
  ).join('')

  const projectOpts = ['', ...projects].map(p =>
    `<option value="${p}" ${row.project===p?'selected':''}>${p || (projects.length ? '— выберите —' : '— нет проектов —')}</option>`
  ).join('')

  return `
    <td><span class="drag-handle" title="Перетащить в другой этап">⠿</span></td>
    <td>
      <select class="cell-select" onchange="updateRow(${row.id},'status',this.value)">
        ${statusOpts}
      </select>
      <span class="badge ${row.status}" style="pointer-events:none;margin-left:4px;font-size:10px;">●</span>
    </td>
    <td><select class="cell-select" onchange="updateRow(${row.id},'client',this.value);renderTable()">${clientOpts}</select></td>
    <td><input class="cell-input" value="${esc(row.description)}" placeholder="Описание..." oninput="updateRow(${row.id},'description',this.value)" style="min-width:160px;"></td>
    <td><select class="cell-select" onchange="updateRow(${row.id},'execProducer',this.value)">${peopleOpts}</select></td>
    <td><select class="cell-select" onchange="updateRow(${row.id},'lineProducer',this.value)">${linePeopleOpts}</select></td>
    <td><select class="cell-select" onchange="updateRow(${row.id},'accountManager',this.value)">${amOpts}</select></td>
    <td style="min-width:140px;">
      <input class="cell-input date-input" value="${esc(row.dateRaw)}" placeholder="напр. 14-20 мая"
        oninput="updateRow(${row.id},'dateRaw',this.value);refreshDateCell(this)"
        style="min-width:120px;">
      ${display ? `<div class="date-display" style="font-size:12px;margin-top:2px;">${display}</div>` : ''}
    </td>
    <td><select class="cell-select" onchange="updateRow(${row.id},'format',this.value)">${fmtOpts}</select></td>
    <td><select class="cell-select" onchange="updateRow(${row.id},'location',this.value)">${locOpts}</select></td>
    <td><select class="cell-select" onchange="updateRow(${row.id},'project',this.value)">${projectOpts}</select></td>
  `
}

function esc(s) { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;') }

function refreshDateCell(input) {
  const td = input.parentElement
  let disp = td.querySelector('.date-display')
  const { display } = parseSmartDate(input.value)
  if (display) {
    if (!disp) { disp = document.createElement('div'); disp.className='date-display'; disp.style.fontSize='12px';disp.style.marginTop='2px'; td.appendChild(disp) }
    disp.textContent = display
  } else if (disp) { disp.remove() }
}

// ── Mutations ─────────────────────────────────────────────────────────────────

function updateRow(id, field, value) {
  const row = rows.find(r => r.id === id)
  if (!row) return
  row[field] = value
  updateCounts()
}

function addRow() {
  const firstStatus = STAGE_STATUSES[activeStage][0]
  const row = makeRow({ status: firstStatus })
  rows.push(row)
  render()
  // Focus description of new row
  const trs = document.querySelectorAll('#table-body tr')
  const last = trs[trs.length - 1]
  if (last) { const inp = last.querySelector('.cell-input'); if (inp) inp.focus() }
}

function selectStage(stage) {
  activeStage = stage
  render()
}

// ── Drag & Drop ───────────────────────────────────────────────────────────────

let dragging = null  // { rowId, startX, startY, ghost }

function startDrag(e, rowId) {
  e.preventDefault()
  const row = rows.find(r => r.id === rowId)
  if (!row) return

  dragging = { rowId, startX: e.clientX, startY: e.clientY }

  const ghost = document.getElementById('ghost')
  ghost.textContent = `${row.client || '—'} · ${row.description || 'Без описания'}`
  ghost.style.left = e.clientX + 12 + 'px'
  ghost.style.top  = e.clientY - 20 + 'px'
  ghost.classList.add('visible')

  // Mark tr
  const tr = document.querySelector(`#table-body tr[data-id="${rowId}"]`)
  if (tr) tr.classList.add('dragging')

  document.addEventListener('mousemove', onDragMove)
  document.addEventListener('mouseup', onDragUp)
}

function onDragMove(e) {
  if (!dragging) return
  const ghost = document.getElementById('ghost')
  ghost.style.left = e.clientX + 12 + 'px'
  ghost.style.top  = e.clientY - 20 + 'px'

  // Highlight stage under cursor
  document.querySelectorAll('.stage').forEach(el => {
    const r = el.getBoundingClientRect()
    const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom
    el.classList.toggle('drag-over', over)
  })
}

function onDragUp(e) {
  if (!dragging) return
  document.removeEventListener('mousemove', onDragMove)
  document.removeEventListener('mouseup', onDragUp)

  const ghost = document.getElementById('ghost')
  ghost.classList.remove('visible')

  // Find target stage
  let targetStage = null
  document.querySelectorAll('.stage').forEach(el => {
    el.classList.remove('drag-over')
    const r = el.getBoundingClientRect()
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
      targetStage = el.dataset.stage
    }
  })

  if (targetStage && targetStage !== statusToStage(rows.find(r => r.id === dragging.rowId)?.status)) {
    // Move to first status of target stage
    const newStatus = STAGE_STATUSES[targetStage][0]
    updateRow(dragging.rowId, 'status', newStatus)
    // Animate then re-render
    const tr = document.querySelector(`#table-body tr[data-id="${dragging.rowId}"]`)
    if (tr) {
      tr.style.transition = 'opacity .2s, transform .2s'
      tr.style.opacity = '0'
      tr.style.transform = 'translateX(20px)'
      setTimeout(() => render(), 200)
    } else {
      render()
    }
  } else {
    const tr = document.querySelector(`#table-body tr[data-id="${dragging.rowId}"]`)
    if (tr) tr.classList.remove('dragging')
  }

  dragging = null
}

// ── Smart date hint tooltip ───────────────────────────────────────────────────

document.addEventListener('focusin', e => {
  if (e.target.classList.contains('date-input')) {
    showTip(e.target)
  }
})
document.addEventListener('focusout', e => {
  if (e.target.classList.contains('date-input')) hideTip()
})

let tipEl = null
function showTip(input) {
  hideTip()
  tipEl = document.createElement('div')
  tipEl.className = 'tooltip'
  tipEl.innerHTML = `<b>Форматы:</b> &nbsp;25 мая &nbsp;·&nbsp; 14-20 мая &nbsp;·&nbsp; 3, 7, 14 июня &nbsp;·&nbsp; апрель`
  document.body.appendChild(tipEl)
  const r = input.getBoundingClientRect()
  tipEl.style.left = r.left + 'px'
  tipEl.style.top = (r.bottom + 6) + 'px'
}
function hideTip() { if (tipEl) { tipEl.remove(); tipEl = null } }

// ── Init ──────────────────────────────────────────────────────────────────────
render()
</script>
