<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Структура</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; color: #1e293b; }

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid #e2e8f0;
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; height: 52px;
}
.topbar h2 { font-size: 16px; font-weight: 600; }
.tabs { display: flex; gap: 2px; }
.tab { padding: 5px 16px; font-size: 13px; font-weight: 500; color: #64748b; cursor: pointer; border-radius: 6px; }
.tab.active { background: #eff6ff; color: #2563eb; }
.sep { width: 1px; height: 24px; background: #e2e8f0; }
.btn { border: none; border-radius: 7px; padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 500; transition: .15s; }
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-ghost { background: transparent; color: #475569; border: 1px solid #e2e8f0; }
.btn-ghost:hover { background: #f1f5f9; }
.zoom-display { font-size: 12px; color: #64748b; min-width: 40px; text-align: center; }
.hint { font-size: 12px; color: #94a3b8; margin-left: auto; }

#canvas {
  position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
  overflow: hidden; cursor: grab;
}
#canvas.grabbing { cursor: grabbing; }
#world { position: absolute; transform-origin: 0 0; }

#lines-svg { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

/* Chart */
.chart-row { display: flex; gap: 60px; align-items: flex-start; }

.dept-group { display: flex; flex-direction: column; align-items: center; gap: 0; }

.dept-card {
  border-radius: 10px; padding: 11px 24px;
  font-size: 14px; font-weight: 700; color: #fff; text-align: center;
  cursor: pointer; min-width: 180px; white-space: nowrap;
  transition: box-shadow .15s, transform .1s;
  position: relative;
}
.dept-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.2); transform: translateY(-1px); }
.dept-card .edit-icon {
  position: absolute; top: 6px; right: 8px;
  font-size: 12px; opacity: 0; transition: opacity .15s;
  pointer-events: none;
}
.dept-card:hover .edit-icon { opacity: 0.7; }

/* Subs row — centered under dept */
.subs-row { display: flex; gap: 16px; align-items: flex-start; justify-content: center; margin-top: 32px; }

/* Add sub — separate, centered below subs row */
.add-sub-wrap { display: flex; justify-content: center; margin-top: 12px; }
.add-sub-btn {
  background: none; border: 1.5px dashed #cbd5e1; color: #94a3b8;
  border-radius: 8px; padding: 6px 16px; font-size: 12px; cursor: pointer; transition: .15s;
}
.add-sub-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

/* Sub block */
.sub-block {
  background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px;
  min-width: 170px; max-width: 210px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden;
  transition: box-shadow .15s, transform .1s;
}
.sub-block:hover { box-shadow: 0 6px 20px rgba(0,0,0,.12); transform: translateY(-2px); }

.sub-head { padding: 10px 14px 8px; border-bottom: 1px solid #f1f5f9; }
.sub-name { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 5px; }
.sub-leader-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #94a3b8; margin-bottom: 2px; }
.sub-leader-name { font-size: 12px; font-weight: 600; color: #2563eb; }
.sub-leader-name.empty { color: #cbd5e1; font-style: italic; font-weight: 400; }

.sub-people { padding: 6px 14px 4px; }
.person-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 3px 0; border-bottom: 1px solid #f8fafc; gap: 6px;
}
.person-row:last-child { border-bottom: none; }
.person-info { display: flex; flex-direction: column; }
.person-name { font-size: 12px; font-weight: 500; color: #334155; }
.person-role { font-size: 11px; color: #94a3b8; }
.person-del {
  opacity: 0; background: none; border: none; cursor: pointer;
  color: #94a3b8; font-size: 14px; padding: 0 2px; line-height: 1;
  transition: .15s; flex-shrink: 0;
}
.person-row:hover .person-del { opacity: 1; }
.person-del:hover { color: #dc2626; }

.sub-add-person {
  display: block; width: 100%; background: none;
  border: none; border-top: 1px dashed #e2e8f0;
  padding: 6px 14px; font-size: 11px; color: #94a3b8; text-align: left;
  cursor: pointer; transition: .15s; margin-top: 2px;
}
.sub-add-person:hover { color: #2563eb; background: #f8faff; }

/* Context menu */
.ctx {
  position: fixed; background: #fff; border: 1px solid #e2e8f0;
  border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
  padding: 4px; z-index: 500; min-width: 180px; display: none;
}
.ctx.open { display: block; }
.ctx-item { padding: 7px 12px; font-size: 13px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.ctx-item:hover { background: #f1f5f9; }
.ctx-item.red { color: #dc2626; }
.ctx-item.red:hover { background: #fef2f2; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 600; display: none; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 12px; padding: 24px; width: 340px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 5px; }
.field input { width: 100%; border: 1px solid #e2e8f0; border-radius: 7px; padding: 8px 11px; font-size: 14px; outline: none; transition: .15s; }
.field input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
.color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.cdot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: .15s; }
.cdot.sel, .cdot:hover { border-color: #0f172a; transform: scale(1.15); }
.mactions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>

<div class="topbar">
  <h2>Сотрудники</h2>
  <div class="tabs">
    <div class="tab">Список</div>
    <div class="tab active">Структура</div>
  </div>
  <div class="sep"></div>
  <button class="btn btn-primary" onclick="openModal('add-dept',null)">+ Департамент</button>
  <div class="sep"></div>
  <button class="btn btn-ghost" onclick="doZoom(0.15)">＋</button>
  <div class="zoom-display" id="zoomLabel">100%</div>
  <button class="btn btn-ghost" onclick="doZoom(-0.15)">－</button>
  <button class="btn btn-ghost" onclick="resetView()">⊡</button>
  <span class="hint">ПКМ на блоке — меню · Колесо — зум · Тащи фон — пан</span>
</div>

<div id="canvas">
  <div id="world">
    <svg id="lines-svg"><g id="lines-g"></g></svg>
    <div id="chart" style="position:relative;padding:60px 80px 120px"></div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx" id="ctx">
  <div class="ctx-item" onclick="ctxAction('edit')">✏️ Редактировать</div>
  <div class="ctx-item" id="ctx-add-sub" onclick="ctxAction('add-sub')" style="display:none">📁 Добавить отдел</div>
  <div class="ctx-item" id="ctx-add-person" onclick="ctxAction('add-person')" style="display:none">👤 Добавить сотрудника</div>
  <div class="ctx-item red" onclick="ctxAction('delete')">🗑 Удалить</div>
</div>

<!-- Modal -->
<div class="modal-bg" id="mbg">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="mtitle"></h3>
    <div id="mcolor" class="color-row" style="display:none"></div>
    <div class="field"><label id="ml1"></label><input id="mi1" autocomplete="off"></div>
    <div class="field" id="mf2" style="display:none"><label id="ml2"></label><input id="mi2" autocomplete="off"></div>
    <div class="mactions">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveModal()">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ─── Data ──────────────────────────────────────────────────────────────────────
let data = [
  { id:'d1', name:'Производство', color:'#1e40af', subs:[
    { id:'s1', name:'Монтаж', leader:'Иванов И.И.',
      persons:[{ id:'p1', name:'Петрова А.С.', role:'Монтажёр' },{ id:'p2', name:'Сидоров П.В.', role:'Монтажёр' }] },
    { id:'s2', name:'Графика', leader:'Козлова М.Р.',
      persons:[{ id:'p3', name:'Новиков Д.А.', role:'Дизайнер' }] },
    { id:'s3', name:'Звук', leader:'',
      persons:[{ id:'p4', name:'Орлов С.Н.', role:'Звукорежиссёр' }] },
  ]},
  { id:'d2', name:'Редакция', color:'#065f46', subs:[
    { id:'s4', name:'Сценарный отдел', leader:'Фёдоров К.В.',
      persons:[{ id:'p5', name:'Мишина О.В.', role:'Сценарист' },{ id:'p6', name:'Белов А.Р.', role:'Редактор' }] },
  ]},
  { id:'d3', name:'Техника', color:'#7c3aed', subs:[
    { id:'s5', name:'Съёмочная группа', leader:'Тихонов И.С.',
      persons:[{ id:'p7', name:'Дроздов М.В.', role:'Оператор' },{ id:'p8', name:'Яковлев Р.Н.', role:'Осветитель' }] },
    { id:'s6', name:'Трансляция', leader:'', persons:[] },
  ]},
]

const COLORS = ['#1e40af','#065f46','#7c3aed','#9a3412','#0f766e','#be185d','#b45309','#374151']
let selColor = COLORS[0]

// ─── Pan / Zoom ───────────────────────────────────────────────────────────────
let scale = 1, ox = 60, oy = 40, dragging = false, lastX, lastY

const canvas = document.getElementById('canvas')
const world  = document.getElementById('world')

function applyT() {
  world.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`
  document.getElementById('zoomLabel').textContent = Math.round(scale*100)+'%'
}

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return
  dragging = true; lastX = e.clientX; lastY = e.clientY
  canvas.classList.add('grabbing')
})
window.addEventListener('mousemove', e => {
  if (!dragging) return
  ox += e.clientX - lastX; oy += e.clientY - lastY
  lastX = e.clientX; lastY = e.clientY; applyT()
})
window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('grabbing') })

canvas.addEventListener('wheel', e => {
  e.preventDefault()
  const d = e.deltaY > 0 ? -0.1 : 0.1
  const rect = canvas.getBoundingClientRect()
  const mx = e.clientX - rect.left, my = e.clientY - rect.top
  const bx = (mx - ox)/scale, by = (my - oy)/scale
  scale = Math.max(0.3, Math.min(2.5, scale + d))
  ox = mx - bx*scale; oy = my - by*scale; applyT()
}, { passive: false })

function doZoom(d) {
  const cx = canvas.clientWidth/2, cy = canvas.clientHeight/2
  const bx=(cx-ox)/scale, by=(cy-oy)/scale
  scale = Math.max(0.3, Math.min(2.5, scale+d))
  ox=cx-bx*scale; oy=cy-by*scale; applyT()
}
function resetView() { scale=1; ox=60; oy=40; applyT() }
applyT()

// ─── Render ───────────────────────────────────────────────────────────────────
function uid() { return '_'+Math.random().toString(36).slice(2) }

function render() {
  const chart = document.getElementById('chart')
  chart.innerHTML = ''

  if (data.length === 0) {
    chart.innerHTML = '<div style="color:#94a3b8;font-size:14px;padding:40px">Нажми «+ Департамент» чтобы начать</div>'
    return
  }

  const row = document.createElement('div')
  row.className = 'chart-row'
  data.forEach(dept => row.appendChild(makeDeptGroup(dept)))
  chart.appendChild(row)

  requestAnimationFrame(() => requestAnimationFrame(drawLines))
}

function makeDeptGroup(dept) {
  const group = document.createElement('div')
  group.className = 'dept-group'

  // Dept card
  const card = document.createElement('div')
  card.className = 'dept-card'
  card.id = 'dept-'+dept.id
  card.style.background = dept.color
  card.innerHTML = `<span class="edit-icon">✏️</span>${dept.name}`
  card.addEventListener('contextmenu', e => openCtx(e, {type:'dept', dept}))
  card.addEventListener('dblclick', e => { e.stopPropagation(); openModal('edit-dept', {type:'dept', dept}) })
  group.appendChild(card)

  // Subs row (only if there are subs)
  if (dept.subs.length > 0) {
    const subsRow = document.createElement('div')
    subsRow.className = 'subs-row'
    subsRow.id = 'subs-'+dept.id
    dept.subs.forEach(sub => subsRow.appendChild(makeSubBlock(dept, sub)))
    group.appendChild(subsRow)
  }

  // "+ Отдел" — отдельно, по центру, ниже
  const addWrap = document.createElement('div')
  addWrap.className = 'add-sub-wrap'
  // add some top margin if there are subs
  addWrap.style.marginTop = dept.subs.length > 0 ? '12px' : '32px'
  const ab = document.createElement('button')
  ab.className = 'add-sub-btn'
  ab.textContent = '+ Отдел'
  ab.onclick = () => openModal('add-sub', {dept})
  addWrap.appendChild(ab)
  group.appendChild(addWrap)

  return group
}

function makeSubBlock(dept, sub) {
  const block = document.createElement('div')
  block.className = 'sub-block'
  block.id = 'sub-'+sub.id
  block.style.borderTopColor = dept.color
  block.style.borderTopWidth = '3px'

  // Head
  const head = document.createElement('div')
  head.className = 'sub-head'
  head.innerHTML = `
    <div class="sub-name">${sub.name}</div>
    <div class="sub-leader-label">Руководитель</div>
    <div class="sub-leader-name ${sub.leader ? '' : 'empty'}">${sub.leader || '— не назначен —'}</div>
  `
  block.appendChild(head)

  // People
  const people = document.createElement('div')
  people.className = 'sub-people'
  if (sub.persons.length === 0) {
    people.innerHTML = `<div style="font-size:11px;color:#cbd5e1;font-style:italic;padding:4px 0">Сотрудников нет</div>`
  } else {
    sub.persons.forEach(p => {
      const prow = document.createElement('div')
      prow.className = 'person-row'
      prow.innerHTML = `
        <div class="person-info">
          <span class="person-name">${p.name}</span>
          <span class="person-role">${p.role}</span>
        </div>
        <button class="person-del" title="Удалить" onclick="deletePerson('${dept.id}','${sub.id}','${p.id}')">×</button>
      `
      people.appendChild(prow)
    })
  }
  block.appendChild(people)

  // Add person btn
  const addP = document.createElement('button')
  addP.className = 'sub-add-person'
  addP.textContent = '+ добавить сотрудника'
  addP.onclick = e => { e.stopPropagation(); openModal('add-person', {dept, sub}) }
  block.appendChild(addP)

  block.addEventListener('contextmenu', e => openCtx(e, {type:'sub', dept, sub}))
  return block
}

function deletePerson(deptId, subId, personId) {
  const dept = data.find(d=>d.id===deptId)
  const sub = dept?.subs.find(s=>s.id===subId)
  if (sub) sub.persons = sub.persons.filter(p=>p.id!==personId)
  render()
}

// ─── SVG Lines (symmetric, offset-based — zoom-safe) ─────────────────────────
// getBoundingClientRect is affected by CSS transform/scale, so we use
// offsetLeft/offsetTop which walk the layout tree in untransformed coordinates.
function worldPos(el) {
  let x = 0, y = 0
  let cur = el
  while (cur && cur !== world) {
    x += cur.offsetLeft
    y += cur.offsetTop
    cur = cur.offsetParent
  }
  return { x, y }
}

function drawLines() {
  const svg = document.getElementById('lines-svg')
  const g = document.getElementById('lines-g')
  g.innerHTML = ''

  const chartEl = document.getElementById('chart')

  data.forEach(dept => {
    if (dept.subs.length === 0) return
    const dCard = document.getElementById('dept-'+dept.id)
    const subsRowEl = document.getElementById('subs-'+dept.id)
    if (!dCard || !subsRowEl) return

    const dp = worldPos(dCard)
    const dCx   = dp.x + dCard.offsetWidth / 2
    const dBotY = dp.y + dCard.offsetHeight

    const sp = worldPos(subsRowEl)
    const subsTopY = sp.y

    const midY = dBotY + (subsTopY - dBotY) / 2

    const subEls = subsRowEl.querySelectorAll('.sub-block')
    const subData = []
    subEls.forEach(el => {
      const p = worldPos(el)
      subData.push({ cx: p.x + el.offsetWidth / 2, topY: p.y })
    })
    if (subData.length === 0) return

    const leftX  = subData[0].cx
    const rightX = subData[subData.length - 1].cx

    // 1. Vertical: dept bottom → midY
    line(g, dCx, dBotY, dCx, midY, dept.color)
    // 2. Horizontal: leftmost → rightmost at midY
    if (subData.length > 1) line(g, leftX, midY, rightX, midY, dept.color)
    // 3. Verticals: midY → each sub top
    subData.forEach(s => line(g, s.cx, midY, s.cx, s.topY, dept.color))
  })

  svg.setAttribute('width', chartEl.scrollWidth)
  svg.setAttribute('height', chartEl.scrollHeight)
}

function line(g, x1,y1,x2,y2, color) {
  const el = document.createElementNS('http://www.w3.org/2000/svg','line')
  el.setAttribute('x1',x1); el.setAttribute('y1',y1)
  el.setAttribute('x2',x2); el.setAttribute('y2',y2)
  el.setAttribute('stroke', color)
  el.setAttribute('stroke-width','2')
  el.setAttribute('stroke-opacity','0.45')
  g.appendChild(el)
}

// ─── Context menu ─────────────────────────────────────────────────────────────
let ctxTarget = null
const ctxEl = document.getElementById('ctx')

function openCtx(e, target) {
  e.preventDefault(); e.stopPropagation()
  ctxTarget = target
  document.getElementById('ctx-add-sub').style.display    = target.type==='dept' ? 'flex' : 'none'
  document.getElementById('ctx-add-person').style.display = target.type==='sub'  ? 'flex' : 'none'
  ctxEl.style.left = e.clientX+'px'; ctxEl.style.top = e.clientY+'px'
  ctxEl.classList.add('open')
}
document.addEventListener('click', () => ctxEl.classList.remove('open'))

function ctxAction(action) {
  const t = ctxTarget
  ctxEl.classList.remove('open')
  if (action==='edit') {
    openModal(t.type==='dept' ? 'edit-dept' : 'edit-sub', t)
  } else if (action==='add-sub') {
    openModal('add-sub', t)
  } else if (action==='add-person') {
    openModal('add-person', t)
  } else if (action==='delete') {
    if (t.type==='dept') data = data.filter(d=>d.id!==t.dept.id)
    else t.dept.subs = t.dept.subs.filter(s=>s.id!==t.sub.id)
    render()
  }
}

// ─── Modal ────────────────────────────────────────────────────────────────────
let mMode=null, mTarget=null

const MODAL_CFG = {
  'add-dept':   { title:'Новый департамент',       l1:'Название',          color:true },
  'edit-dept':  { title:'Редактировать департамент', l1:'Название',        color:true },
  'add-sub':    { title:'Новый отдел',              l1:'Название отдела',   l2:'Руководитель (ФИО)' },
  'edit-sub':   { title:'Редактировать отдел',      l1:'Название отдела',   l2:'Руководитель (ФИО)' },
  'add-person': { title:'Новый сотрудник',          l1:'ФИО',               l2:'Должность' },
}

function openModal(mode, target) {
  mMode=mode; mTarget=target
  const cfg = MODAL_CFG[mode]

  document.getElementById('mtitle').textContent = cfg.title
  document.getElementById('ml1').textContent = cfg.l1
  document.getElementById('mi1').value = ''
  document.getElementById('mcolor').style.display = cfg.color ? 'flex' : 'none'
  document.getElementById('mf2').style.display = cfg.l2 ? 'block' : 'none'
  if (cfg.l2) { document.getElementById('ml2').textContent=cfg.l2; document.getElementById('mi2').value='' }

  if (cfg.color) buildColorPicker(mode==='edit-dept' ? target.dept.color : COLORS[0])

  if (mode==='edit-dept') document.getElementById('mi1').value = target.dept.name
  if (mode==='edit-sub') {
    document.getElementById('mi1').value = target.sub.name
    document.getElementById('mi2').value = target.sub.leader || ''
  }

  document.getElementById('mbg').classList.add('open')
  setTimeout(()=>document.getElementById('mi1').focus(), 50)
}

function buildColorPicker(current) {
  selColor = current
  const row = document.getElementById('mcolor')
  row.innerHTML = ''
  COLORS.forEach(c => {
    const d = document.createElement('div')
    d.className = 'cdot'+(c===current?' sel':'')
    d.style.background = c
    d.onclick = () => { selColor=c; row.querySelectorAll('.cdot').forEach(x=>x.classList.remove('sel')); d.classList.add('sel') }
    row.appendChild(d)
  })
}

function closeModal() { document.getElementById('mbg').classList.remove('open') }

function saveModal() {
  const v1 = document.getElementById('mi1').value.trim()
  const v2 = document.getElementById('mi2') ? document.getElementById('mi2').value.trim() : ''
  if (!v1) { document.getElementById('mi1').focus(); return }

  if (mMode==='add-dept')   data.push({id:uid(), name:v1, color:selColor, subs:[]})
  else if (mMode==='edit-dept')   { mTarget.dept.name=v1; mTarget.dept.color=selColor }
  else if (mMode==='add-sub')     mTarget.dept.subs.push({id:uid(), name:v1, leader:v2||'', persons:[]})
  else if (mMode==='edit-sub')    { mTarget.sub.name=v1; mTarget.sub.leader=v2||'' }
  else if (mMode==='add-person')  mTarget.sub.persons.push({id:uid(), name:v1, role:v2||'—'})

  closeModal(); render()
}

document.getElementById('mbg').addEventListener('click', e=>{ if(e.target===document.getElementById('mbg')) closeModal() })
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && document.getElementById('mbg').classList.contains('open')) saveModal()
  if (e.key==='Escape') closeModal()
})

render()
</script>
</body>
</html>
