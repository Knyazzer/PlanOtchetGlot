<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Структура — мокап</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }

  /* Page chrome */
  .page { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .page-title { font-size: 20px; font-weight: 600; }
  .btn { border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-ghost { background: transparent; color: #64748b; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #f1f5f9; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 2px solid #e2e8f0; margin-bottom: 24px; }
  .tab { padding: 8px 20px; font-size: 14px; font-weight: 500; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
  .tab:hover:not(.active) { color: #334155; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .toolbar-sep { width: 1px; height: 24px; background: #e2e8f0; }
  .tool-hint { font-size: 13px; color: #94a3b8; margin-left: auto; }

  /* Org chart canvas */
  .canvas { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; overflow: auto; min-height: 480px; position: relative; }

  /* Tree layout */
  .tree { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .tree-level { display: flex; justify-content: center; gap: 32px; position: relative; }

  /* Connector lines via SVG overlay */
  .connectors { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

  /* Node cards */
  .node { display: flex; flex-direction: column; align-items: center; }
  .node-card {
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: box-shadow .15s, transform .1s;
    position: relative;
    text-align: center;
    user-select: none;
  }
  .node-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .node-card.selected { outline: 2px solid #2563eb; outline-offset: 2px; }

  /* Department (root) */
  .node-dept .node-card {
    background: #1e40af;
    color: #fff;
    min-width: 160px;
    padding: 12px 20px;
  }
  .node-dept .node-card .node-icon { font-size: 18px; margin-bottom: 4px; }
  .node-dept .node-card .node-name { font-size: 14px; font-weight: 700; }

  /* Sub-department */
  .node-sub .node-card {
    background: #eff6ff;
    border: 2px solid #bfdbfe;
    color: #1e40af;
    min-width: 130px;
  }
  .node-sub .node-card .node-icon { font-size: 14px; margin-bottom: 2px; }
  .node-sub .node-card .node-name { font-size: 13px; font-weight: 600; }

  /* Person */
  .node-person .node-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    color: #1e293b;
    min-width: 110px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .node-person .node-card .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #dbeafe;
    color: #2563eb;
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 6px;
  }
  .node-person .node-card .node-name { font-size: 12px; font-weight: 600; }
  .node-person .node-card .node-role { font-size: 11px; color: #64748b; margin-top: 2px; }

  /* Add button nodes */
  .add-btn {
    border: 2px dashed #cbd5e1;
    background: transparent;
    color: #94a3b8;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: .15s;
    white-space: nowrap;
  }
  .add-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }

  /* Vertical lines between levels */
  .v-line { width: 2px; height: 24px; background: #cbd5e1; }
  .h-line-wrap { position: relative; display: flex; justify-content: center; width: 100%; }

  /* Context menu */
  .ctx-menu {
    position: fixed;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 4px;
    z-index: 1000;
    min-width: 160px;
    display: none;
  }
  .ctx-menu.open { display: block; }
  .ctx-item { padding: 8px 12px; font-size: 13px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .ctx-item:hover { background: #f1f5f9; }
  .ctx-item.danger { color: #dc2626; }
  .ctx-item.danger:hover { background: #fef2f2; }

  /* Edit modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 900; display: none; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal label { font-size: 12px; font-weight: 500; color: #64748b; display: block; margin-bottom: 4px; }
  .modal input { width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 10px; font-size: 14px; margin-bottom: 14px; outline: none; }
  .modal input:focus { border-color: #2563eb; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .color-picker { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: .15s; }
  .color-dot.active, .color-dot:hover { border-color: #1e293b; transform: scale(1.15); }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="page-header">
    <h2 class="page-title">Сотрудники</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="openAddDept()">+ Департамент</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab" onclick="switchTab('list')">Список</div>
    <div class="tab active" onclick="switchTab('structure')">Структура</div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn btn-ghost" style="font-size:13px;padding:6px 12px" onclick="zoomIn()">＋ Увеличить</button>
    <button class="btn btn-ghost" style="font-size:13px;padding:6px 12px" onclick="zoomOut()">－ Уменьшить</button>
    <button class="btn btn-ghost" style="font-size:13px;padding:6px 12px" onclick="resetZoom()">⊡ По размеру</button>
    <div class="toolbar-sep"></div>
    <span class="tool-hint">Правый клик на карточке — редактировать / удалить</span>
  </div>

  <!-- Canvas -->
  <div class="canvas" id="canvas">
    <div id="chart-wrap" style="transform-origin:top center;transition:transform .2s">
      <div id="chart"></div>
    </div>
  </div>

</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" onclick="ctxEdit()">✏️ Редактировать</div>
  <div class="ctx-item" id="ctxAddSub" onclick="ctxAddSub()" style="display:none">📁 Добавить отдел</div>
  <div class="ctx-item" id="ctxAddPerson" onclick="ctxAddPerson()" style="display:none">👤 Добавить сотрудника</div>
  <div class="ctx-item danger" onclick="ctxDelete()">🗑 Удалить</div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle">Редактировать</h3>
    <div id="modalColorRow" style="display:none">
      <label>Цвет</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <label id="labelName">Название</label>
    <input id="inputName" placeholder="Введите название...">
    <label id="labelRole" style="display:none">Должность</label>
    <input id="inputRole" placeholder="Должность..." style="display:none">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveModal()">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
let data = [
  {
    id: 'd1', name: 'Производство', color: '#1e40af',
    subs: [
      { id: 's1', name: 'Монтаж', persons: [
        { id: 'p1', name: 'Иванов И.И.', role: 'Монтажёр' },
        { id: 'p2', name: 'Петрова А.С.', role: 'Старший монтажёр' },
      ]},
      { id: 's2', name: 'Графика', persons: [
        { id: 'p3', name: 'Сидоров П.В.', role: 'Дизайнер' },
      ]},
    ]
  },
  {
    id: 'd2', name: 'Редакция', color: '#065f46',
    subs: [
      { id: 's3', name: 'Сценарный', persons: [
        { id: 'p4', name: 'Козлова М.Р.', role: 'Сценарист' },
        { id: 'p5', name: 'Новиков Д.А.', role: 'Редактор' },
      ]},
    ]
  },
  {
    id: 'd3', name: 'Техника', color: '#6b21a8',
    subs: [
      { id: 's4', name: 'Съёмочная группа', persons: [
        { id: 'p6', name: 'Орлов С.Н.', role: 'Оператор' },
        { id: 'p7', name: 'Фёдоров К.В.', role: 'Осветитель' },
      ]},
    ]
  },
]

let scale = 1
let ctxTarget = null  // { type, dept?, sub?, person? }
let modalTarget = null
let modalMode = null  // 'edit' | 'add-dept' | 'add-sub' | 'add-person'

const COLORS = ['#1e40af','#065f46','#6b21a8','#9a3412','#0f766e','#1d4ed8','#7c3aed','#b45309']
let selectedColor = COLORS[0]

// ── Render ─────────────────────────────────────────────────────────────────────
function render() {
  const chart = document.getElementById('chart')
  chart.innerHTML = ''
  if (data.length === 0) {
    chart.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:60px 0;font-size:14px">Нет департаментов. Нажми «+ Департамент» чтобы начать.</div>'
    return
  }

  // Horizontal row of departments
  const row = document.createElement('div')
  row.style.cssText = 'display:flex;gap:48px;justify-content:center;align-items:flex-start'
  data.forEach(dept => row.appendChild(renderDept(dept)))
  chart.appendChild(row)
}

function renderDept(dept) {
  const wrap = document.createElement('div')
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:0'

  // Dept card
  const card = mkCard('dept', dept.name, null, dept.color)
  card.innerHTML = `<div class="node-icon">🏢</div><div class="node-name">${dept.name}</div>`
  card.addEventListener('contextmenu', e => openCtx(e, { type:'dept', dept }))
  wrap.appendChild(card)

  if (dept.subs.length === 0 && true) {
    // Just add-sub btn
    const vl = mkVLine(); wrap.appendChild(vl)
    const ab = mkAddBtn('+ Добавить отдел', () => openAddSub(dept))
    wrap.appendChild(ab)
  } else {
    // V line down
    wrap.appendChild(mkVLine())
    // Horizontal row of subs + add-btn
    const subsRow = document.createElement('div')
    subsRow.style.cssText = 'display:flex;gap:24px;align-items:flex-start;position:relative'

    // Draw horizontal connector line through top of subsRow
    dept.subs.forEach(sub => subsRow.appendChild(renderSub(dept, sub)))

    // Add sub btn
    const abWrap = document.createElement('div')
    abWrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;padding-top:24px'
    abWrap.appendChild(mkAddBtn('+ Отдел', () => openAddSub(dept)))
    subsRow.appendChild(abWrap)

    wrap.appendChild(subsRow)
  }

  return wrap
}

function renderSub(dept, sub) {
  const wrap = document.createElement('div')
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:0'

  // Sub card
  const card = mkCard('sub', sub.name, null, dept.color)
  card.innerHTML = `<div class="node-icon" style="font-size:13px">📁</div><div class="node-name">${sub.name}</div>`
  card.style.cssText += `;border-color:${dept.color}40;color:${dept.color}`
  card.addEventListener('contextmenu', e => openCtx(e, { type:'sub', dept, sub }))
  wrap.appendChild(card)

  // Persons
  if (sub.persons.length > 0) {
    wrap.appendChild(mkVLine())
    const personsRow = document.createElement('div')
    personsRow.style.cssText = 'display:flex;gap:12px;align-items:flex-start'
    sub.persons.forEach(p => personsRow.appendChild(renderPerson(dept, sub, p)))
    // Add person btn
    const ab = mkAddBtn('+ Сотрудник', () => openAddPerson(dept, sub))
    ab.style.marginTop = '0'
    const abW = document.createElement('div')
    abW.style.cssText = 'display:flex;align-items:center;padding-top:4px'
    abW.appendChild(ab)
    personsRow.appendChild(abW)
    wrap.appendChild(personsRow)
  } else {
    wrap.appendChild(mkVLine())
    wrap.appendChild(mkAddBtn('+ Сотрудник', () => openAddPerson(dept, sub)))
  }

  return wrap
}

function renderPerson(dept, sub, p) {
  const wrap = document.createElement('div')
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:0'

  const card = document.createElement('div')
  card.className = 'node-card'
  card.style.cssText = 'background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;cursor:pointer;transition:box-shadow .15s,transform .1s;text-align:center;min-width:100px;box-shadow:0 1px 4px rgba(0,0,0,.06)'
  const initials = p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
  card.innerHTML = `
    <div style="width:36px;height:36px;border-radius:50%;background:${dept.color}20;color:${dept.color};font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 6px">${initials}</div>
    <div style="font-size:12px;font-weight:600;color:#1e293b">${p.name}</div>
    <div style="font-size:11px;color:#64748b;margin-top:2px">${p.role}</div>
  `
  card.addEventListener('contextmenu', e => openCtx(e, { type:'person', dept, sub, person: p }))
  card.addEventListener('mouseenter', () => card.style.boxShadow = '0 6px 20px rgba(0,0,0,.12)')
  card.addEventListener('mouseleave', () => card.style.boxShadow = '0 1px 4px rgba(0,0,0,.06)')
  wrap.appendChild(card)
  return wrap
}

function mkCard(type, name, role, color) {
  const card = document.createElement('div')
  card.className = 'node-card'
  if (type === 'dept') {
    card.style.cssText = `background:${color};color:#fff;border-radius:10px;padding:12px 20px;min-width:150px;cursor:pointer;transition:box-shadow .15s,transform .1s;text-align:center`
  } else {
    card.style.cssText = `background:#eff6ff;border:2px solid ${color}60;color:${color};border-radius:8px;padding:8px 14px;min-width:120px;cursor:pointer;transition:box-shadow .15s,transform .1s;text-align:center`
  }
  card.addEventListener('mouseenter', () => { card.style.transform='translateY(-2px)'; card.style.boxShadow='0 6px 20px rgba(0,0,0,.12)' })
  card.addEventListener('mouseleave', () => { card.style.transform=''; card.style.boxShadow='' })
  return card
}

function mkVLine() {
  const el = document.createElement('div')
  el.style.cssText = 'width:2px;height:24px;background:#cbd5e1;flex-shrink:0'
  return el
}

function mkAddBtn(label, cb) {
  const btn = document.createElement('button')
  btn.className = 'add-btn'
  btn.textContent = label
  btn.onclick = cb
  return btn
}

// ── Zoom ───────────────────────────────────────────────────────────────────────
function zoomIn() { scale = Math.min(scale + 0.15, 2); applyZoom() }
function zoomOut() { scale = Math.max(scale - 0.15, 0.4); applyZoom() }
function resetZoom() { scale = 1; applyZoom() }
function applyZoom() { document.getElementById('chart-wrap').style.transform = `scale(${scale})` }

// ── Context menu ───────────────────────────────────────────────────────────────
function openCtx(e, target) {
  e.preventDefault()
  ctxTarget = target
  const menu = document.getElementById('ctxMenu')
  document.getElementById('ctxAddSub').style.display = target.type === 'dept' ? 'flex' : 'none'
  document.getElementById('ctxAddPerson').style.display = target.type === 'sub' ? 'flex' : 'none'
  menu.style.left = e.clientX + 'px'
  menu.style.top = e.clientY + 'px'
  menu.classList.add('open')
}
document.addEventListener('click', () => document.getElementById('ctxMenu').classList.remove('open'))

function ctxEdit() {
  const t = ctxTarget
  if (t.type === 'dept') openModal('edit-dept', t)
  else if (t.type === 'sub') openModal('edit-sub', t)
  else openModal('edit-person', t)
}
function ctxAddSub() { openAddSub(ctxTarget.dept) }
function ctxAddPerson() { openAddPerson(ctxTarget.dept, ctxTarget.sub) }
function ctxDelete() {
  const t = ctxTarget
  if (t.type === 'dept') data = data.filter(d => d.id !== t.dept.id)
  else if (t.type === 'sub') t.dept.subs = t.dept.subs.filter(s => s.id !== t.sub.id)
  else t.sub.persons = t.sub.persons.filter(p => p.id !== t.person.id)
  render()
}

// ── Modal ──────────────────────────────────────────────────────────────────────
function openAddDept() { openModal('add-dept', null) }
function openAddSub(dept) { openModal('add-sub', { type:'sub', dept }) }
function openAddPerson(dept, sub) { openModal('add-person', { type:'person', dept, sub }) }

function openModal(mode, target) {
  modalMode = mode; modalTarget = target
  document.getElementById('inputName').value = ''
  document.getElementById('inputRole').value = ''
  document.getElementById('labelRole').style.display = 'none'
  document.getElementById('inputRole').style.display = 'none'
  document.getElementById('modalColorRow').style.display = 'none'

  if (mode === 'edit-dept') {
    document.getElementById('modalTitle').textContent = 'Редактировать департамент'
    document.getElementById('inputName').value = target.dept.name
    document.getElementById('labelName').textContent = 'Название департамента'
    showColorPicker(target.dept.color)
  } else if (mode === 'add-dept') {
    document.getElementById('modalTitle').textContent = 'Новый департамент'
    document.getElementById('labelName').textContent = 'Название департамента'
    showColorPicker(COLORS[0])
  } else if (mode === 'edit-sub') {
    document.getElementById('modalTitle').textContent = 'Редактировать отдел'
    document.getElementById('inputName').value = target.sub.name
    document.getElementById('labelName').textContent = 'Название отдела'
  } else if (mode === 'add-sub') {
    document.getElementById('modalTitle').textContent = 'Новый отдел'
    document.getElementById('labelName').textContent = 'Название отдела'
  } else if (mode === 'edit-person') {
    document.getElementById('modalTitle').textContent = 'Редактировать сотрудника'
    document.getElementById('inputName').value = target.person.name
    document.getElementById('inputRole').value = target.person.role
    document.getElementById('labelName').textContent = 'ФИО'
    document.getElementById('labelRole').style.display = 'block'
    document.getElementById('inputRole').style.display = 'block'
  } else if (mode === 'add-person') {
    document.getElementById('modalTitle').textContent = 'Новый сотрудник'
    document.getElementById('labelName').textContent = 'ФИО'
    document.getElementById('labelRole').style.display = 'block'
    document.getElementById('inputRole').style.display = 'block'
  }

  document.getElementById('modalBg').classList.add('open')
  setTimeout(() => document.getElementById('inputName').focus(), 50)
}

function showColorPicker(current) {
  selectedColor = current
  document.getElementById('modalColorRow').style.display = 'block'
  const picker = document.getElementById('colorPicker')
  picker.innerHTML = ''
  COLORS.forEach(c => {
    const dot = document.createElement('div')
    dot.className = 'color-dot' + (c === current ? ' active' : '')
    dot.style.background = c
    dot.onclick = () => { selectedColor = c; document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active')); dot.classList.add('active') }
    picker.appendChild(dot)
  })
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalBg')) {
    document.getElementById('modalBg').classList.remove('open')
  }
}

function uid() { return Math.random().toString(36).slice(2) }

function saveModal() {
  const name = document.getElementById('inputName').value.trim()
  const role = document.getElementById('inputRole').value.trim()
  if (!name) { document.getElementById('inputName').focus(); return }

  if (modalMode === 'add-dept') {
    data.push({ id: uid(), name, color: selectedColor, subs: [] })
  } else if (modalMode === 'edit-dept') {
    modalTarget.dept.name = name; modalTarget.dept.color = selectedColor
  } else if (modalMode === 'add-sub') {
    modalTarget.dept.subs.push({ id: uid(), name, persons: [] })
  } else if (modalMode === 'edit-sub') {
    modalTarget.sub.name = name
  } else if (modalMode === 'add-person') {
    modalTarget.sub.persons.push({ id: uid(), name, role: role || '—' })
  } else if (modalMode === 'edit-person') {
    modalTarget.person.name = name; modalTarget.person.role = role
  }

  document.getElementById('modalBg').classList.remove('open')
  render()
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  event.target.classList.add('active')
}

// Enter to save
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('modalBg').classList.contains('open')) saveModal()
  if (e.key === 'Escape') closeModal({target: document.getElementById('modalBg')})
})

render()
</script>
</body>
</html>
