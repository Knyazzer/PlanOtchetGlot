version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tvshifts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvshifts_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tvshifts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tvshifts}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tvshifts}:${POSTGRES_PASSWORD:-tvshifts_pass}@postgres:5432/${POSTGRES_DB:-tvshifts}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules

volumes:
  postgres_data:
