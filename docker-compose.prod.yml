version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Не открываем порт наружу — только внутри Docker сети

  api:
    image: ghcr.io/knyazzer/planotchetglot-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      WEB_URL: ${WEB_URL}
      NODE_ENV: production
      PORT: 4000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_PROJECTS_SHEET_ID: ${GOOGLE_PROJECTS_SHEET_ID}
      GOOGLE_REGISTRY_SHEET_ID: ${GOOGLE_REGISTRY_SHEET_ID}
    expose:
      - "4000"
    ports:
      - "127.0.0.1:4000:4000"

  web:
    image: ghcr.io/knyazzer/planotchetglot-web:latest
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/queries.yaml:ro
    ports:
      - "127.0.0.1:9187:9187"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # pg_dump раз в 24 часа
    entrypoint: >
      /bin/sh -c '
        while true; do
          sleep 86400;
          pg_dump -h postgres -U ${POSTGRES_USER} ${POSTGRES_DB} | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
          find /backups -name "*.sql.gz" -mtime +30 -delete;
        done
      '

volumes:
  postgres_data:
